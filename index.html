<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Chinese browsers auto-translate the recipe text and mangle it. Judges must see the original. -->
<meta name="google" content="notranslate" />
<title>圓圓 YuanYuan AI — a voice that cooks with you 陪你煮飯的聲音</title>
<style>
  :root{
    --bg:#141110;
    --panel:#1d1917;
    --panel-2:#25201d;
    --line:#332c28;
    --text:#f4efea;
    --muted:#a0938a;
    --accent:#e8a13a;
    --accent-soft:rgba(232,161,58,.14);
    --sage:#8fb98a;
    --sage-soft:rgba(143,185,138,.13);
    --warm:#e0705a;
    --radius:16px;
    --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,"Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:26px 22px 150px}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(150deg,var(--accent),#c9761f);
    display:grid;place-items:center;font-size:20px;
  }
  h1{font-size:17px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .sub .zhname{color:var(--text);font-weight:600}

  .headright{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .status,.stage{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;font-size:12.5px;color:var(--muted);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#5a504a;flex:none;transition:background .2s}
  .dot.live{background:var(--sage);box-shadow:0 0 0 4px var(--sage-soft)}
  .dot.connecting{background:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .stage b{color:var(--text);font-weight:600}
  .stage.picking b{color:var(--accent)}
  .stage.cooking b{color:var(--warm)}
  .stage.waiting b{color:var(--sage)}
  .stage.done b{color:var(--sage)}

  .grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;align-items:start}
  @media(max-width:840px){ .grid{grid-template-columns:1fr} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 21px}
  .card h2{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:0 0 14px}

  /* --- the recipe book, before anything is chosen --- */
  .menu{display:grid;gap:11px}
  .dish{
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;transition:border-color .2s,transform .2s;
  }
  .dish.hit{border-color:rgba(232,161,58,.55);transform:translateX(3px)}
  .dish .zh{font-size:15px;font-weight:600}
  .dish .en{color:var(--muted);font-size:12.5px;margin-top:2px}
  .dish .meta{color:var(--muted);font-size:11.5px;margin-top:8px}

  /* --- the live step --- */
  .stepnum{color:var(--accent);font-size:11.5px;font-weight:700;letter-spacing:1px}
  .steptext{font-size:22px;line-height:1.42;margin-top:10px;font-weight:500}
  .stepzh{font-size:17.5px;line-height:1.55;margin-top:9px;color:#d8c6ae;font-weight:500}
  .dishname{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:15px;border-bottom:1px solid var(--line)}
  .dishname .zh{font-size:17px;font-weight:650}
  .dishname .en{color:var(--muted);font-size:13px}

  .idle{color:var(--muted);font-size:14.5px;line-height:1.65}
  .idle b{color:var(--text);font-weight:600}

  /* --- timer --- */
  .timer{margin-top:22px;display:none;align-items:center;gap:15px}
  .timer.on{display:flex}
  .ring{position:relative;width:74px;height:74px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ring .bgc{stroke:var(--line)}
  .ring .fgc{stroke:var(--sage);transition:stroke-dashoffset .95s linear}
  .ring .num{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;
  }
  .timer .label{font-size:13.5px;color:var(--muted);line-height:1.5}
  .timer .label .zh{display:block;color:#c9b9a6;font-size:13px;margin-top:2px}
  .timer .label b{display:block;color:var(--sage);font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
  .timer.rang .ring .fgc{stroke:var(--accent)}
  .timer.rang .label b{color:var(--accent)}

  /* --- ingredients + step list --- */
  .ing{display:flex;flex-wrap:wrap;gap:7px}
  .ing span{
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:12.5px;
  }
  .ing span i{font-style:normal;color:var(--muted);margin-left:5px;font-size:11.5px}
  .card h2 em{font-style:normal;color:var(--muted);opacity:.8;margin-left:7px;letter-spacing:0}
  .zhtag{color:var(--muted);font-weight:400}

  .steps{list-style:none;margin:0;padding:0}
  .steps li{
    display:flex;gap:11px;padding:9px 0;font-size:13px;line-height:1.5;
    color:var(--muted);border-bottom:1px solid rgba(51,44,40,.6);
  }
  .steps li:last-child{border-bottom:0}
  .steps li .zh{display:block;margin-top:3px;color:#a8968a}
  .steps li.now .zh{color:#d8c6ae}
  .steps li .n{
    flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;font-size:10.5px;margin-top:1px;
  }
  .steps li.now{color:var(--text)}
  .steps li.now .n{background:var(--accent);border-color:var(--accent);color:#241503;font-weight:700}
  .steps li.past{opacity:.45}
  .steps li.past .n{background:var(--sage);border-color:var(--sage);color:#10240f}

  /* --- transcript --- */
  .feed{
    margin-top:16px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:6px 0;min-height:84px;max-height:230px;overflow-y:auto;
  }
  .feed:empty::after{
    content:"Press the button, then just talk — 按下按鈕，直接開口說「我想煮泡麵升級版」";
    display:block;padding:27px 20px;text-align:center;color:var(--muted);font-size:13px;
  }
  .line{padding:9px 20px;font-size:13.5px;line-height:1.5;display:flex;gap:11px;align-items:flex-start}
  .line .who{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--muted);padding-top:3px;width:50px}
  .line.you .who{color:var(--accent)}
  .line.partial{opacity:.5}
  .line.act{color:var(--sage);font-size:12.5px}
  .line .zh{display:block;margin-top:4px;font-size:13px;color:#c9b9a6;line-height:1.5}
  .line.you .zh{display:none}

  .err{
    margin-top:14px;padding:12px 15px;border-radius:10px;font-size:13px;
    background:rgba(224,112,90,.12);border:1px solid rgba(224,112,90,.4);color:#ffb9ac;
  }
  .err:empty{display:none}

  /* --- bottom bar --- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(transparent,var(--bg) 26%);
    padding:30px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:13px;
  }
  button.mic{
    display:flex;align-items:center;gap:11px;
    background:var(--accent);color:#1c1204;border:0;
    font-family:var(--font);font-size:15px;font-weight:650;
    padding:15px 30px;border-radius:999px;cursor:pointer;
    transition:transform .15s,box-shadow .2s,background .2s;
    box-shadow:0 8px 28px rgba(232,161,58,.24);
  }
  button.mic:hover{transform:translateY(-1px)}
  button.mic:disabled{opacity:.55;cursor:default;transform:none}
  button.mic.on{background:var(--warm);color:#fff;box-shadow:0 8px 28px rgba(224,112,90,.26)}
  button.mic svg{width:17px;height:17px}

  .settings{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
  .settings label{display:flex;align-items:center;gap:7px;cursor:pointer}
  .settings select{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:7px;padding:5px 8px;font-family:var(--font);font-size:12px;
  }
  .settings input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
  .settings .off{opacity:.45;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark">🍜</div>
      <div>
        <h1>YuanYuan AI &mdash; cook along with me</h1>
        <div class="sub"><span class="zhname">圓圓</span> &middot; your hands are wet, and cooking alone is boring &middot; 手是濕的，而且一個人煮飯很無聊</div>
      </div>
    </div>
    <div class="headright">
      <div class="stage" id="stage"><span>Stage 階段</span><b id="stageText">idle</b></div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Not connected 未連線</span></div>
    </div>
  </header>

  <div class="grid">
    <div>
      <div class="card" id="stageCard">
        <h2 id="stageCardTitle">Tonight <em>今晚</em></h2>
        <div id="live"></div>
        <div class="timer" id="timer">
          <div class="ring">
            <svg width="74" height="74"><circle class="bgc" cx="37" cy="37" r="32"></circle><circle class="fgc" id="ringFg" cx="37" cy="37" r="32"></circle></svg>
            <div class="num" id="ringNum">0:00</div>
          </div>
          <div class="label"><b id="timerState">Waiting 等待中</b><span id="timerLabel"></span><span class="zh" id="timerLabelZh"></span></div>
        </div>
      </div>
      <div class="err" id="err"></div>
      <div class="feed" id="feed"></div>
    </div>

    <div class="card" id="side">
      <h2>Recipe book <em>食譜書</em></h2>
      <div id="sideBody"></div>
    </div>
  </div>

</div>

<div class="bar">
  <button class="mic" id="micBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
    </svg>
    <span id="micLabel">Start talking 開始說話</span>
  </button>
  <div class="settings" id="settings">
    <label>Voice replies in 語音回答
      <select id="langSel">
        <option value="en">English 英文</option>
        <option value="zh">繁體中文</option>
      </select>
    </label>
    <label title="On speakers the agent hears itself and answers itself. Tick this only when you are wearing headphones — it turns barge-in back on.">
      <input type="checkbox" id="headphoneChk" />
      I'm on headphones 我戴著耳機 <span style="opacity:.6">(barge-in 可中途插話)</span>
    </label>
    <label title="Experimental: lets the agent speak first when a timer ends. Verify against the API before filming.">
      <input type="checkbox" id="nudgeChk" />
      Speak first when a timer ends 計時結束時主動開口 <span style="opacity:.6">(experimental 實驗中)</span>
    </label>
    <span style="opacity:.6">Screen is always bilingual 畫面一律中英對照</span>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   YuanYuan AI — a voice companion that cooks with you.

   Your hands are wet or greasy, so voice is the only channel left.
   And a recipe is mostly waiting — that dead time is what this is for.

   One WebSocket to AssemblyAI's Voice Agent API carries speech in,
   speech out, turn detection, and the tool calls that move the recipe.
   --------------------------------------------------------------- */

const AGENT_WS      = "wss://agents.assemblyai.com/v1/ws";
const TOKEN_ENDPOINT = "/api/voice-token";
const SAMPLE_RATE   = 24000;   // the Voice Agent API speaks PCM16 @ 24 kHz
const CHUNK_MS      = 50;

/* ---- the recipe book ------------------------------------------
   Three recipes, hand-written. The point of this project is the
   companion, not the corpus — a thousand recipes would not make the
   kitchen any less lonely.
   --------------------------------------------------------------- */

const RECIPES = [
  {
    id:"noodles",
    zh:"泡麵升級版", en:"Upgraded Instant Noodles",
    minutes:12,
    blurb:"The one you already know, made worth sitting down for.",
    blurbZh:"你早就會的那碗，煮到值得坐下來好好吃。",
    keys:["泡麵","麵","雞蛋","蛋","青菜","蔥","辣油","noodle","noodles","egg","greens","scallion","instant"],
    ingredients:[
      { zh:"泡麵 1 包",   en:"1 pack instant noodles" },
      { zh:"雞蛋 1 顆",   en:"1 egg" },
      { zh:"青菜 一把",   en:"A handful of leafy greens" },
      { zh:"蔥花 適量",   en:"Chopped scallion" },
      { zh:"辣油 一匙",   en:"A spoon of chilli crisp" }
    ],
    steps:[
      { text:"Pour 500ml of water into a small pot, lid on, high heat.",
        zh:"小鍋裝 500 毫升水，蓋上蓋子，開大火。",
        wait:180, label:"Water coming to a boil", labelZh:"等水滾" },
      { text:"Water's up. Drop the noodle block in and leave it alone — no seasoning yet.",
        zh:"水滾了。麵餅放下去就別動它，調味包先不要加。",
        wait:90, label:"Noodles softening", labelZh:"等麵變軟" },
      { text:"Crack the egg straight onto the noodles. Don't stir it, let it set.",
        zh:"蛋直接打在麵上面，不要攪，讓它自己凝固。",
        wait:60, label:"Egg setting", labelZh:"等蛋凝固" },
      { text:"Now the sachets — but only half the oil packet. Trust me on that one.",
        zh:"現在加調味包，但油包只加一半，相信我。" },
      { text:"Greens in, then kill the heat. They'll cook in the heat that's left.",
        zh:"青菜丟進去，然後關火，餘溫就會把它燙熟。",
        wait:30, label:"Greens wilting", labelZh:"等青菜變軟" },
      { text:"Into a bowl. Scallion on top, a spoon of chilli crisp. That's dinner.",
        zh:"盛進碗裡，撒上蔥花，加一匙辣油。晚餐好了。" }
    ]
  },
  {
    id:"tomato_egg",
    zh:"番茄炒蛋", en:"Tomato Egg Stir-fry",
    minutes:15,
    blurb:"The dish every kitchen in Taiwan can make blindfolded.",
    blurbZh:"台灣每個廚房閉著眼睛都會做的一道。",
    keys:["番茄","蕃茄","雞蛋","蛋","蔥","糖","鹽","tomato","tomatoes","egg","eggs","sugar","scallion"],
    ingredients:[
      { zh:"番茄 2 顆（切塊）", en:"2 tomatoes, in wedges" },
      { zh:"雞蛋 3 顆",        en:"3 eggs" },
      { zh:"蔥花 適量",        en:"Chopped scallion" },
      { zh:"糖 一小撮",        en:"A pinch of sugar" },
      { zh:"鹽 適量",          en:"Salt" }
    ],
    steps:[
      { text:"Beat three eggs with a pinch of salt until it's all one colour.",
        zh:"三顆蛋加一點鹽打散，打到顏色均勻。" },
      { text:"Hot pan, generous oil. Egg in, push it around until it's just set, then take it straight out.",
        zh:"鍋燒熱、油多一點。蛋下鍋推到剛凝固就馬上盛起來。" },
      { text:"Same pan, tomato wedges in. Don't touch them — let them collapse on their own.",
        zh:"同一個鍋，番茄下鍋。不要翻動，讓它自己出水軟掉。",
        wait:120, label:"Tomatoes breaking down", labelZh:"等番茄出水軟掉" },
      { text:"A pinch of sugar now. That's the trick — it takes the sourness off.",
        zh:"這時候加一小撮糖，這是關鍵，可以把酸味壓下去。" },
      { text:"Egg back in, fold it through twice, scallion on top, off the heat.",
        zh:"蛋倒回去，翻拌兩下，撒蔥花，關火。" }
    ]
  },
  {
    id:"garlic_rice",
    zh:"蒜香奶油炒飯", en:"Garlic Butter Fried Rice",
    minutes:10,
    blurb:"Yesterday's rice, and four cloves of garlic doing all the work.",
    blurbZh:"隔夜飯，加四瓣蒜就搞定。",
    keys:["飯","冷飯","白飯","蒜","蒜頭","奶油","醬油","蔥","蛋","雞蛋","rice","garlic","butter","soy","scallion","egg"],
    ingredients:[
      { zh:"冷飯 2 碗",          en:"2 bowls day-old rice" },
      { zh:"蒜頭 4 瓣（切末）",  en:"4 cloves garlic, chopped" },
      { zh:"奶油 一大塊",        en:"A big knob of butter" },
      { zh:"醬油 適量",          en:"Soy sauce" },
      { zh:"雞蛋 1 顆",          en:"1 egg" },
      { zh:"蔥花 適量",          en:"Chopped scallion" }
    ],
    steps:[
      { text:"Melt a big knob of butter on medium heat, then slide the chopped garlic in.",
        zh:"中火融一大塊奶油，然後把蒜末滑進去。",
        wait:60, label:"Garlic going golden", labelZh:"等蒜變金黃" },
      { text:"Garlic's golden — rice in. Break every clump with the back of the spoon.",
        zh:"蒜變金黃了，飯下鍋。用鍋鏟背面把飯粒壓散。",
        wait:90, label:"Rice frying", labelZh:"炒飯中" },
      { text:"Push the rice to one side, crack the egg into the gap, scramble it there, then mix it through.",
        zh:"飯撥到一邊，蛋打進空位炒散，再跟飯拌勻。" },
      { text:"Soy sauce down the hot side of the pan, not onto the rice. You'll hear it.",
        zh:"醬油沿著鍋邊淋，不要直接倒在飯上，你會聽到滋一聲。" },
      { text:"Scallion, one last toss, and it's done.",
        zh:"撒蔥花，最後翻一下，完成。" }
    ]
  }
];

/* Stage names the person actually reads. */
const STAGE_ZH = { idle:"待命", picking:"選菜", cooking:"下鍋", waiting:"等待", done:"完成" };

/* ---- state ----------------------------------------------------- */

const STORE_KEY = "yuanyuan.cook.v2";

let stage    = "idle";     // idle | picking | cooking | waiting | done
let recipe   = null;
let stepIdx  = -1;
let matched  = [];         // ids highlighted by suggest_dishes

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ id: recipe && recipe.id, stepIdx }));
  }catch(e){ /* private mode — the screen is still correct */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    const r = RECIPES.find(x => x.id === s.id);
    if(r && s.stepIdx >= 0 && s.stepIdx < r.steps.length){
      recipe = r; stepIdx = s.stepIdx; stage = "cooking";
    }
  }catch(e){ /* fall through to a clean start */ }
}

/* ---- elements --------------------------------------------------- */

const liveEl      = document.getElementById("live");
const sideBodyEl  = document.getElementById("sideBody");
const sideEl      = document.getElementById("side");
const stageCardT  = document.getElementById("stageCardTitle");
const feedEl      = document.getElementById("feed");
const errEl       = document.getElementById("err");
const dotEl       = document.getElementById("dot");
const statusEl    = document.getElementById("statusText");
const stageEl     = document.getElementById("stage");
const stageTextEl = document.getElementById("stageText");
const micBtn      = document.getElementById("micBtn");
const micLabel    = document.getElementById("micLabel");
const timerEl     = document.getElementById("timer");
const ringFg      = document.getElementById("ringFg");
const ringNum     = document.getElementById("ringNum");
const timerLabel  = document.getElementById("timerLabel");
const timerLabelZh= document.getElementById("timerLabelZh");
const timerState  = document.getElementById("timerState");
const langSel     = document.getElementById("langSel");
const nudgeChk    = document.getElementById("nudgeChk");
const headphoneChk= document.getElementById("headphoneChk");
const settingsEl  = document.getElementById("settings");

const RING_LEN = 2 * Math.PI * 32;
ringFg.style.strokeDasharray = RING_LEN;
ringFg.style.strokeDashoffset = RING_LEN;

/* ---- rendering -------------------------------------------------- */

function setStage(s){
  stage = s;
  stageEl.className = "stage " + s;
  stageTextEl.textContent = s + " " + (STAGE_ZH[s] || "");
  render();
}

function render(){
  renderLive();
  renderSide();
}

function renderLive(){
  if(!recipe){
    stageCardT.innerHTML = 'Tonight <em>今晚</em>';
    liveEl.innerHTML = `
      <div class="idle">
        Tell me <b>what you feel like eating</b> — or just read out what's in the fridge
        and I'll find something. Then keep your hands where they are: I'll walk you
        through it one step at a time, and stay on the line while things cook.
        <div class="stepzh" style="margin-top:14px">
          跟我說<b style="color:#e8c78f">你想吃什麼</b>，或直接報冰箱裡有什麼，我幫你挑。
          然後手就別動了，我會一步一步帶你煮，等待的時候也會一直陪著你講話。
        </div>
      </div>`;
    return;
  }
  const done = stepIdx >= recipe.steps.length;
  stageCardT.innerHTML = done ? 'Finished <em>完成</em>' : 'Right now <em>現在這一步</em>';
  const head = `
    <div class="dishname">
      <span class="zh">${recipe.zh}</span>
      <span class="en">${recipe.en}</span>
    </div>`;
  if(done){
    liveEl.innerHTML = head + `
      <div class="stepnum">DONE 完成</div>
      <div class="steptext">Sit down and eat it while it's hot. I'll be here.</div>
      <div class="stepzh">趁熱坐下來吃吧，我在這裡。</div>`;
    return;
  }
  const st = recipe.steps[stepIdx];
  liveEl.innerHTML = head + `
    <div class="stepnum">STEP ${stepIdx + 1} OF ${recipe.steps.length} &middot; 第 ${stepIdx + 1} 步／共 ${recipe.steps.length} 步</div>
    <div class="steptext">${st.text}</div>
    <div class="stepzh">${st.zh}</div>`;
}

function renderSide(){
  if(!recipe){
    sideEl.querySelector("h2").innerHTML = 'Recipe book <em>食譜書</em>';
    sideBodyEl.innerHTML = `<div class="menu">` + RECIPES.map(r => `
      <div class="dish ${matched.includes(r.id) ? "hit" : ""}">
        <div class="zh">${r.zh}</div>
        <div class="en">${r.en}</div>
        <div class="meta">${r.minutes} min &middot; ${r.blurb}</div>
        <div class="meta" style="color:#c9b9a6">${r.minutes} 分鐘 &middot; ${r.blurbZh}</div>
      </div>`).join("") + `</div>`;
    return;
  }
  sideEl.querySelector("h2").innerHTML = 'What you need <em>需要準備</em>';
  sideBodyEl.innerHTML = `
    <div class="ing">${recipe.ingredients.map(i => `<span>${i.zh}<i>${i.en}</i></span>`).join("")}</div>
    <h2 style="margin:20px 0 10px">The whole way through <em>完整步驟</em></h2>
    <ul class="steps">${recipe.steps.map((s,i) => `
      <li class="${i === stepIdx ? "now" : (i < stepIdx ? "past" : "")}">
        <span class="n">${i < stepIdx ? "&#10003;" : i + 1}</span>
        <span>${s.text}<span class="zh">${s.zh}</span></span>
      </li>`).join("")}</ul>`;
}

function say(who, text, cls, zh){
  const div = document.createElement("div");
  div.className = "line " + (cls || "");
  div.innerHTML = `<span class="who">${who}</span><span class="body"><span class="txt"></span><span class="zh"></span></span>`;
  div.querySelector(".txt").textContent = text;
  if(zh) div.querySelector(".zh").textContent = zh;
  feedEl.appendChild(div);
  feedEl.scrollTop = feedEl.scrollHeight;
  return div;
}

/* The voice stays English; this is how the person actually follows it. */
function subtitle(zh){
  if(!zh) return;
  const target = agentLine || Array.from(feedEl.querySelectorAll(".line")).reverse()
      .find(l => !l.classList.contains("you") && !l.classList.contains("act"));
  if(target) target.querySelector(".zh").textContent = zh;
  else say("圓圓", "", "", zh);
  feedEl.scrollTop = feedEl.scrollHeight;
}

let partialLine = null;
function showPartial(text){
  if(!partialLine) partialLine = say("YOU", text, "you partial");
  else partialLine.querySelector(".txt").textContent = text;
  feedEl.scrollTop = feedEl.scrollHeight;
}
function commitPartial(text){
  if(partialLine){
    partialLine.classList.remove("partial");
    partialLine.querySelector(".txt").textContent = text;
    partialLine = null;
  } else say("YOU", text, "you");
}

let agentLine = null, agentBuf = "";
function showAgentPartial(text){
  if(!agentLine) agentLine = say("圓圓", text, "partial");
  else agentLine.querySelector(".txt").textContent = text;
  feedEl.scrollTop = feedEl.scrollHeight;
}
function commitAgent(text){
  if(agentLine){
    agentLine.classList.remove("partial");
    agentLine.querySelector(".txt").textContent = text;
    agentLine = null;
  } else if(text) say("圓圓", text);
  agentBuf = "";
}

function setStatus(text, state){
  statusEl.textContent = text;
  dotEl.className = "dot" + (state ? " " + state : "");
}
function showError(msg){ errEl.textContent = msg; }

/* ---- the timer --------------------------------------------------
   Waiting is not dead time in this app — it is the feature. The ring
   is only the visible half; the other half is the agent staying on the
   line and talking to you while it runs.
   ----------------------------------------------------------------- */

let timerId = null, timerEnd = 0, timerTotal = 0;

function startTimer(seconds, label, labelZh){
  clearTimer();
  timerTotal = Math.max(1, Math.round(seconds));
  timerEnd = Date.now() + timerTotal * 1000;
  timerLabel.textContent = label || "";
  timerLabelZh.textContent = labelZh || "";
  timerState.textContent = "Waiting 等待中";
  timerEl.classList.add("on");
  timerEl.classList.remove("rang");
  tickTimer();
  timerId = setInterval(tickTimer, 250);
  setStage("waiting");
}

function tickTimer(){
  const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
  const m = Math.floor(left / 60), s = left % 60;
  ringNum.textContent = m + ":" + String(s).padStart(2, "0");
  ringFg.style.strokeDashoffset = RING_LEN * (1 - left / timerTotal);
  if(left <= 0) ringTimer();
}

function ringTimer(){
  clearInterval(timerId); timerId = null;
  timerEl.classList.add("rang");
  timerState.textContent = "Time's up 時間到";
  chime();
  say("TIMER", (timerLabel.textContent || "Timer") + " — done", "act",
      (timerLabelZh.textContent || "計時") + " — 時間到");
  if(stage === "waiting") setStage("cooking");
  // Experimental: let the agent speak first. Unverified against the API,
  // so it is off unless the person ticks the box.
  if(nudgeChk.checked) nudge("[the timer just went off: " + (timerLabel.textContent || "timer") + "]");
}

function clearTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
  timerEl.classList.remove("on","rang");
}

function chime(){
  try{
    const c = new AudioContext();
    [880, 1174].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(c.destination);
      const t = c.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.start(t); o.stop(t + 0.55);
    });
    setTimeout(() => c.close(), 1500);
  }catch(e){ /* no audio context — the ring already went orange */ }
}

/* ---- the five things it can do ---------------------------------- */

function findRecipe(name){
  if(!name) return null;
  const q = String(name).toLowerCase().trim();
  return RECIPES.find(r =>
    r.id === q || r.zh === name || r.en.toLowerCase() === q ||
    r.en.toLowerCase().includes(q) || r.zh.includes(name) ||
    q.includes(r.en.toLowerCase())
  ) || null;
}

function stepPayload(){
  if(!recipe) return { error:"No recipe started yet. Call start_recipe first." };
  if(stepIdx >= recipe.steps.length){
    return { finished:true, dish:recipe.en, message:"All steps are done." };
  }
  const s = recipe.steps[stepIdx];
  return {
    dish: recipe.en,
    step_number: stepIdx + 1,
    of: recipe.steps.length,
    instruction: s.text,
    instruction_zh: s.zh,
    subtitle_hint: "Say the English instruction out loud, then call show_subtitle with instruction_zh.",
    timer_running: !!s.wait,
    timer_seconds: s.wait || 0,
    stage
  };
}

const TOOLS = {
  suggest_dishes({ have }){
    const list = Array.isArray(have) ? have : String(have || "").split(/[,、\s]+/);
    const words = list.map(x => String(x).toLowerCase().trim()).filter(Boolean);
    const scored = RECIPES.map(r => {
      const hits = r.keys.filter(k => words.some(w => w.includes(k.toLowerCase()) || k.toLowerCase().includes(w)));
      return { r, score: new Set(hits).size };
    }).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0,3);

    matched = scored.map(x => x.r.id);
    setStage("picking");

    if(!scored.length){
      return { matches: [], message: "Nothing in the book matches that. Offer the three dishes by name instead.", book: RECIPES.map(r => r.en) };
    }
    say("MATCH", scored.map(x => x.r.en).join(", "), "act",
        "配對到：" + scored.map(x => x.r.zh).join("、"));
    return {
      matches: scored.map(x => ({
        dish: x.r.en, dish_zh: x.r.zh, minutes: x.r.minutes,
        needs: x.r.ingredients.map(i => i.en)
      }))
    };
  },

  start_recipe({ dish }){
    const r = findRecipe(dish);
    if(!r) return { error:`I don't know "${dish}". The book has: ` + RECIPES.map(x => x.en).join(", ") };
    recipe = r; stepIdx = 0; matched = [];
    clearTimer();
    setStage("cooking");
    saveState();
    say("RECIPE", r.en + " — " + r.steps.length + " steps", "act",
        r.zh + " — 共 " + r.steps.length + " 步");
    const first = recipe.steps[0];
    if(first.wait) startTimer(first.wait, first.label, first.labelZh);
    return {
      dish: r.en, dish_zh: r.zh, total_steps: r.steps.length,
      ingredients: r.ingredients.map(i => i.en),
      ...stepPayload()
    };
  },

  next_step(){
    if(!recipe) return { error:"Nothing is cooking yet. Ask what they want to make." };
    if(stepIdx >= recipe.steps.length) return { finished:true, message:"Already finished." };
    stepIdx += 1;
    saveState();
    if(stepIdx >= recipe.steps.length){
      clearTimer();
      setStage("done");
      say("RECIPE", recipe.en + " — finished", "act", recipe.zh + " — 完成");
      return { finished:true, dish:recipe.en, message:"That was the last step. Tell them it's ready, briefly." };
    }
    const s = recipe.steps[stepIdx];
    clearTimer();
    if(s.wait) startTimer(s.wait, s.label, s.labelZh);
    else setStage("cooking");
    return stepPayload();
  },

  repeat_step(){ return stepPayload(); },

  // The person's English is weak. The voice stays English for the room;
  // this is the line they actually read.
  //
  // Called BEFORE the spoken reply, never after. A tool result always prompts a
  // new turn from the model — so a subtitle tool called *after* speaking makes the
  // agent answer itself, forever. Putting it first makes the tool result the thing
  // that triggers the one spoken reply, and the turn ends there.
  show_subtitle({ zh }){
    const t = String(zh || "").trim();
    if(!t) return { error:"Nothing to show. Pass the Traditional Chinese text." };
    subtitle(t);
    return { ok:true, now:"Say that same line in English, then stop and wait for them." };
  },

  set_timer({ seconds, label, label_zh }){
    const n = Math.round(Number(seconds) || 0);
    if(!n || n < 1) return { error:"How long? Ask them for a number." };
    if(n > 3600) return { error:"That is longer than an hour — check the number with them." };
    startTimer(n, label || "Timer", label_zh || "計時");
    return { timer_running:true, seconds:n, label: label || "Timer", stage };
  }
};

const TOOL_SCHEMA = [
  {
    type:"function", name:"suggest_dishes",
    description:"Match what the person has in the fridge against the recipe book. Call this when they list ingredients instead of naming a dish.",
    parameters:{ type:"object", properties:{
      have:{ type:"array", items:{ type:"string" }, description:"Ingredients they said they have, in Mandarin or English, e.g. ['雞蛋','番茄']" }
    }, required:["have"] }
  },
  {
    type:"function", name:"start_recipe",
    description:"Begin cooking a dish. Loads the ingredients and puts step one on screen. Call this as soon as they have chosen.",
    parameters:{ type:"object", properties:{
      dish:{ type:"string", description:"Dish name, in Mandarin or English, e.g. 泡麵升級版 or upgraded instant noodles" }
    }, required:["dish"] }
  },
  {
    type:"function", name:"next_step",
    description:"Move to the next step. Call this only when they say they are done with the current one. Starts that step's timer automatically if it has one.",
    parameters:{ type:"object", properties:{} }
  },
  {
    type:"function", name:"repeat_step",
    description:"Get the current step again, word for word, when they missed it or ask where they are.",
    parameters:{ type:"object", properties:{} }
  },
  {
    type:"function", name:"show_subtitle",
    description:"Put the Traditional Chinese of what you are ABOUT to say on the screen, then say it in English. Call this once at the start of your turn, before you speak. Never after speaking, and never twice in one turn.",
    parameters:{ type:"object", properties:{
      zh:{ type:"string", description:"Traditional Chinese for the line you are about to say out loud" }
    }, required:["zh"] }
  },
  {
    type:"function", name:"set_timer",
    description:"Start a timer they asked for by hand, on top of the recipe's own timers.",
    parameters:{ type:"object", properties:{
      seconds:{ type:"number", description:"How many seconds" },
      label:{ type:"string", description:"Short label, e.g. 'Noodles'" },
      label_zh:{ type:"string", description:"The same label in Traditional Chinese, e.g. '煮麵'" }
    }, required:["seconds"] }
  }
];

/* ---- who the agent is -------------------------------------------
   The four stages are the whole idea. The tone is not one flat prompt;
   every tool call hands back a stage, and the stage rewrites the mood.
   ----------------------------------------------------------------- */

function systemPrompt(lang){
  const replyRule = lang === "zh"
    ? "- Answer in Traditional Chinese, in one or two short sentences. Never read a whole recipe out at once."
    : "- Answer in English, in one or two short sentences, even when they speak Mandarin to you. Never read a whole recipe out at once.";

  return `You are 圓圓 (YuanYuan), a friend who cooks along with one person in their kitchen at home.
Their hands are wet or greasy, so your voice is the only way they can reach you.
You are here for company first and instructions second. Cooking alone is boring — you are the friend leaning on the counter.

Your tone follows the stage that the tools hand back:
- picking: warm and easy. Two options at most. If they list what is in the fridge, call suggest_dishes.
- cooking: calm and steady. One step, then stop talking and let them work.
- waiting: a timer is running and their hands are free. This is what you are for — talk to them.
  Ask about their day, tell a small story about food, react to what they say.
  Do NOT push them back to the recipe, and do NOT announce the countdown.
- done: proud of them for a sentence, then get out of the way.

SUBTITLES — how every turn of yours is shaped:
The person you are cooking with does not read English well. Your voice is English, but the screen is
how they actually follow you.

So each time it is your turn, in this order:
1. Work out what you want to say.
2. Call show_subtitle ONCE with the Traditional Chinese of that line.
3. Say that same line out loud in English.
4. Stop. Wait for them. Do not start another turn on your own.

Never call show_subtitle after you have spoken, and never twice in the same turn.
When you are reading out a recipe step, pass the instruction_zh the tool gave you, word for word.
If a tool hands you back a result, that is your cue to speak once — not a message from the person.
The only voice you ever answer is theirs.

Rules:
${replyRule}
- To move forward, call next_step — and only when they say they have finished the current step.
- Never recite a step you did not get back from a tool. You do not know any recipe by heart.
- If they missed something, call repeat_step.
- If they ask you to time something, call set_timer, and pass label_zh in Traditional Chinese too.
- If you did not catch the dish or the number, ask one short question instead of guessing.
- Never invent a dish. You only know what the tools give you.`;
}

const GREETING = {
  en: "Hey, I'm here. What are we making?",
  zh: "我在喔，今天想煮什麼？"
};
const GREETING_ZH = "我在喔，今天想煮什麼？";

const KEYTERMS = [
  "泡麵","泡麵升級版","番茄炒蛋","炒飯","蒜香奶油炒飯",
  "雞蛋","番茄","青菜","蔥花","辣油","蒜頭","奶油","醬油","冷飯",
  "下一步","好了","再講一次","沒聽到","計時","幾分鐘","水滾了","關火","可以了嗎",
  "upgraded instant noodles","tomato egg","garlic butter fried rice",
  "next step","say that again","set a timer","翻譯","中文"
];

/* ---- the voice session ------------------------------------------- */

let ws = null, audioCtx = null, micStream = null, workletNode = null, sourceNode = null;
let playCtx = null, playHead = 0;
let running = false;

/* ---- the echo gate ------------------------------------------------
   On laptop speakers the agent hears itself: its own voice goes out, comes
   back through the mic, and gets transcribed as the cook talking. It then
   answers itself. Unless the person is on headphones, we simply stop sending
   microphone frames while the agent's voice is playing.
   ------------------------------------------------------------------- */

let agentSpeaking = false, gateTimer = null;
let headphones = false;   // read from the UI when the session starts

function agentAudioStart(){
  if(headphones) return;
  agentSpeaking = true;
  clearTimeout(gateTimer);
}
function agentAudioEndsSoon(){
  if(headphones) return;
  const remainMs = playCtx ? Math.max(0, (playHead - playCtx.currentTime) * 1000) : 0;
  clearTimeout(gateTimer);
  gateTimer = setTimeout(() => { agentSpeaking = false; }, remainMs + 350);
}
function openGate(){
  clearTimeout(gateTimer);
  agentSpeaking = false;
}

function nudge(text){
  // Unverified message shape — this is the one thing left to test against
  // the live API. Guarded so a rejection can never break a demo.
  try{
    if(ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({ type:"input.text", text }));
    }
  }catch(e){ /* if the API does not take it, the chime already covered us */ }
}

async function start(){
  showError("");
  setStatus("Connecting… 連線中", "connecting");
  micBtn.disabled = true;
  settingsEl.classList.add("off");

  let token;
  try{
    const res = await fetch(TOKEN_ENDPOINT);
    if(!res.ok) throw new Error(`token endpoint returned ${res.status}`);
    ({ token } = await res.json());
    if(!token) throw new Error("token endpoint returned no token");
  }catch(e){
    micBtn.disabled = false;
    settingsEl.classList.remove("off");
    setStatus("Not connected 未連線");
    showError(`Could not get a session token — ${e.message}. Is ASSEMBLYAI_API_KEY set on the deployment?`);
    return;
  }

  try{
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:false, autoGainControl:true }
    });
  }catch(e){
    micBtn.disabled = false;
    settingsEl.classList.remove("off");
    setStatus("Not connected 未連線");
    showError("Microphone permission denied — the browser needs it to hear you.");
    return;
  }

  const lang = langSel.value;
  headphones = headphoneChk.checked;
  openGate();
  const url = new URL(AGENT_WS);
  url.searchParams.set("token", token);
  ws = new WebSocket(url);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type:"session.update",
      session:{
        system_prompt: systemPrompt(lang),
        greeting: GREETING[lang],
        input:{
          format:{ encoding:"audio/pcm" },
          keyterms: KEYTERMS,
          // Barge-in is the kitchen feature: cut it off mid-sentence with your
          // hands full, no button. It needs headphones — on speakers the agent
          // hears itself and interrupts itself, so we only turn it on there.
          turn_detection:{ vad_threshold:0.5, min_silence:500, max_silence:1400, interrupt_response: headphones }
        },
        output:{ voice:"anna", format:{ encoding:"audio/pcm" } },
        tools: TOOL_SCHEMA
      }
    }));
  };

  ws.onmessage = async (raw) => {
    let ev;
    try{ ev = JSON.parse(raw.data); }catch(e){ return; }

    switch(ev.type){
      case "session.ready":
        running = true;
        micBtn.disabled = false;
        micBtn.classList.add("on");
        micLabel.textContent = "Stop 停止";
        setStatus("Listening 聆聽中", "live");
        if(stage === "idle") setStage("picking");
        // The greeting is spoken before the agent can call a tool, so seed its subtitle here.
        setTimeout(() => subtitle(GREETING_ZH), 900);
        await openMic();
        break;

      case "transcript.user.delta":
        showPartial(ev.text || "");
        break;

      case "transcript.user":
        commitPartial(ev.text || "");
        break;

      // Undocumented but real: the agent's line streams in word by word.
      case "transcript.agent.delta": {
        const d = ev.text || "";
        // Some turns send the whole line each time, others only the new piece.
        agentBuf = (agentBuf && d.startsWith(agentBuf)) ? d : agentBuf + d;
        showAgentPartial(agentBuf);
        break;
      }

      case "transcript.agent":
        commitAgent(ev.text || "");
        break;

      case "reply.audio":
        agentAudioStart();
        playChunk(ev.data);
        break;

      case "reply.done":
        if(agentLine) commitAgent(agentBuf);
        if(ev.status === "interrupted"){ stopPlayback(); openGate(); }
        else agentAudioEndsSoon();
        break;

      case "tool.call": {
        const fn = TOOLS[ev.name];
        let result;
        if(!fn){
          result = { error:`Unknown tool ${ev.name}` };
        } else {
          let args = {};
          try{ args = typeof ev.arguments === "string" ? JSON.parse(ev.arguments) : (ev.arguments || {}); }
          catch(e){ args = {}; }
          try{ result = fn(args); }catch(e){ result = { error:String(e && e.message || e) }; }
        }
        ws.send(JSON.stringify({
          type:"tool.result",
          call_id: ev.call_id,
          result: JSON.stringify(result)
        }));
        break;
      }

      case "session.error":
        showError(`${ev.code || "error"}: ${ev.message || "unknown"}${ev.param ? " (" + ev.param + ")" : ""}`);
        break;

      case "session.ended":
        stop();
        break;
    }
  };

  ws.onerror = () => showError("The voice connection dropped. Press start to try again.");
  ws.onclose  = () => { if(running) stop(); };
}

async function openMic(){
  audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
  if(audioCtx.state === "suspended") await audioCtx.resume();

  // The worklet lives in a Blob so this whole app stays one file.
  const workletSrc = `
    class Pump extends AudioWorkletProcessor{
      constructor(){ super(); this.buf = []; this.need = ${Math.round(SAMPLE_RATE * CHUNK_MS / 1000)}; }
      process(inputs){
        const ch = inputs[0] && inputs[0][0];
        if(ch){
          this.buf.push(...ch);
          while(this.buf.length >= this.need){
            const slice = this.buf.splice(0, this.need);
            const pcm = new Int16Array(slice.length);
            for(let i=0;i<slice.length;i++){
              const s = Math.max(-1, Math.min(1, slice[i]));
              pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            this.port.postMessage(pcm.buffer, [pcm.buffer]);
          }
        }
        return true;
      }
    }
    registerProcessor('pump', Pump);`;
  const blobUrl = URL.createObjectURL(new Blob([workletSrc], { type:"application/javascript" }));
  await audioCtx.audioWorklet.addModule(blobUrl);
  URL.revokeObjectURL(blobUrl);

  sourceNode  = audioCtx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioCtx, "pump");
  workletNode.port.onmessage = (e) => {
    if(!ws || ws.readyState !== WebSocket.OPEN) return;
    if(agentSpeaking) return;   // it is talking — do not feed it its own voice
    ws.send(JSON.stringify({ type:"input.audio", audio: toBase64(e.data) }));
  };
  sourceNode.connect(workletNode);
  // Not connected to the destination — we never want the mic echoed back.
}

function toBase64(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);
  let s = "";
  const step = 0x8000;
  for(let i = 0; i < bytes.length; i += step){
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  }
  return btoa(s);
}

/* ---- playback ----------------------------------------------------
   Agent audio is written straight into the AudioContext timeline.
   Sleep-based scheduling drifts and clicks; a running playhead does not.
   ------------------------------------------------------------------ */

function playChunk(b64){
  if(!b64) return;
  if(!playCtx){
    playCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    playHead = playCtx.currentTime;
  }
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(bytes.buffer);

  const buf = playCtx.createBuffer(1, pcm.length, SAMPLE_RATE);
  const ch = buf.getChannelData(0);
  for(let i=0;i<pcm.length;i++) ch[i] = pcm[i] / 32768;

  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);

  const now = playCtx.currentTime;
  if(playHead < now) playHead = now + 0.02;
  src.start(playHead);
  playHead += buf.duration;
}

function stopPlayback(){
  if(!playCtx) return;
  playCtx.close();
  playCtx = null;
  playHead = 0;
}

/* ---- teardown ----------------------------------------------------
   An abandoned session keeps billing until the cap, so always end it.
   ------------------------------------------------------------------ */

function stop(){
  running = false;
  try{ if(ws && ws.readyState === WebSocket.OPEN){ ws.send(JSON.stringify({ type:"session.end" })); ws.close(); } }catch(e){}
  ws = null;
  try{ workletNode && workletNode.disconnect(); }catch(e){}
  try{ sourceNode && sourceNode.disconnect(); }catch(e){}
  try{ micStream && micStream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ audioCtx && audioCtx.close(); }catch(e){}
  workletNode = sourceNode = micStream = audioCtx = null;
  stopPlayback();
  partialLine = agentLine = null;
  agentBuf = "";

  micBtn.disabled = false;
  micBtn.classList.remove("on");
  settingsEl.classList.remove("off");
  openGate();
  micLabel.textContent = "Start talking 開始說話";
  setStatus("Not connected 未連線");
}

micBtn.addEventListener("click", () => running ? stop() : start());
window.addEventListener("beforeunload", () => { if(running) stop(); });

loadState();
setStage(stage);
</script>
