<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<meta name="google" content="notranslate" />
<title>圓圓 YuanYuan AI — a voice that cooks with you 陪你煮飯的聲音</title>
<style>
  :root{
    --bg:#141110;
    --panel:#1d1917;
    --panel-2:#25201d;
    --line:#332c28;
    --text:#f4efea;
    --zh:#d8c6ae;
    --muted:#a0938a;
    --accent:#e8a13a;
    --sage:#8fb98a;
    --warm:#e0705a;
    --radius:16px;
    --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,"Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:22px 22px 178px}

  /* ---- header ---- */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:36px;height:36px;border-radius:11px;flex:none;
    background:linear-gradient(150deg,var(--accent),#c9761f);display:grid;place-items:center;font-size:19px}
  h1{font-size:16px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .sub b{color:var(--text);font-weight:600}
  .headright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    padding:7px 13px;border-radius:999px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#5a504a;flex:none;transition:background .2s}
  .turn{display:flex;align-items:center;gap:9px;padding:8px 17px;border-radius:999px;font-size:13px;
    font-weight:650;border:1px solid transparent;transition:background .25s,border-color .25s,color .25s}
  .turn[hidden]{display:none}
  .turn .ring{width:9px;height:9px;border-radius:50%;flex:none}
  .turn .zh{font-weight:400;opacity:.7;font-size:12px}
  .turn .meter{width:56px;height:5px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden;flex:none}
  .turn .meter i{display:block;height:100%;width:0%;background:currentColor;border-radius:3px;transition:width .07s linear}
  .turn.agent .meter{opacity:.22}
  .turn.you{background:rgba(143,185,138,.13);border-color:rgba(143,185,138,.42);color:var(--sage)}
  .turn.you .ring{background:var(--sage)}
  .turn.agent{background:rgba(232,161,58,.13);border-color:rgba(232,161,58,.42);color:var(--accent)}
  .turn.agent .ring{background:var(--accent);animation:pulse .9s infinite}
  .dot.live{background:var(--sage);box-shadow:0 0 0 4px rgba(143,185,138,.16)}
  .dot.connecting{background:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .pill b{color:var(--text);font-weight:600}
  .pill.picking b,.pill.prep b{color:var(--accent)}
  .pill.cooking b{color:var(--warm)}
  .pill.waiting b,.pill.done b{color:var(--sage)}

  /* ---- progress, at the very top of the work area ---- */
  .prog{height:4px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-bottom:16px;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--sage));transition:width .5s ease}

  /* ---- the now-line: dish + timer ---- */
  .now{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 19px;margin-bottom:14px}
  .dish{flex:1 1 200px;min-width:0}
  .dish .zh{font-size:17px;font-weight:650}
  .dish .en{color:var(--muted);font-size:12.5px;margin-top:2px}
  .dish .idle{color:var(--muted);font-size:13.5px;line-height:1.6}
  .dish .idle .zhline{color:var(--zh);display:block;margin-top:5px}

  .timer{display:none;align-items:center;gap:13px}
  .timer.on{display:flex}
  .ring{position:relative;width:68px;height:68px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ring .bgc{stroke:var(--line)}
  .ring .fgc{stroke:var(--sage);transition:stroke-dashoffset .95s linear}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums}
  .timer .label{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:190px}
  .timer .label b{display:block;color:var(--sage);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
  .timer .label .zh{display:block;color:var(--zh)}
  .timer.rang .ring .fgc{stroke:var(--accent)}
  .timer.rang .label b{color:var(--accent)}

  /* ---- the conversation: the whole point of the screen ---- */
  .feed{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 0;min-height:360px;max-height:min(58vh,620px);overflow-y:auto}
  .feed:empty::after{
    content:"Press the button and just talk — 按下按鈕，直接開口說「我想煮泡麵升級版」";
    display:block;padding:120px 30px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
  .line{padding:11px 22px;display:flex;gap:12px;align-items:flex-start}
  .line .who{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--muted);padding-top:5px;width:38px}
  .line.you .who{color:var(--accent)}
  .line .body{min-width:0;flex:1}
  .line .en{font-size:15.5px;line-height:1.5}
  .line .zh{display:block;margin-top:5px;font-size:14.5px;line-height:1.55;color:var(--zh)}
  .line.you .zh{display:none}
  .line.partial{opacity:.5}
  .line.act .en{color:var(--sage);font-size:12.5px}
  .line.act .zh{color:#8aa886;font-size:12.5px;margin-top:3px}
  .line.warn .en{color:#ffb9ac;font-size:12.5px}
  .line.warn .zh{color:#ffb9ac;opacity:.75;font-size:12.5px;margin-top:3px}

  /* ---- the menu, only before a dish is picked ---- */
  .menu{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
  .menu span{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:13px;transition:border-color .2s}
  .menu span.hit{border-color:rgba(232,161,58,.55)}
  .menu span i{font-style:normal;color:var(--muted);margin-left:6px;font-size:11.5px}

  .err{margin-top:14px;padding:12px 15px;border-radius:10px;font-size:13px;
    background:rgba(224,112,90,.12);border:1px solid rgba(224,112,90,.4);color:#ffb9ac}
  .err:empty{display:none}

  /* ---- bottom ---- */
  .build{position:fixed;right:10px;bottom:5px;z-index:60;font-size:10px;letter-spacing:.05em;
    color:var(--ink);opacity:.32;pointer-events:none;user-select:none}
  /* Attribution. Never rewritten by script, so it survives whatever the
     build stamp below it is doing. */
  .credit{position:fixed;right:10px;bottom:19px;z-index:60;font-size:10px;letter-spacing:.05em;
    color:var(--ink);opacity:.30;pointer-events:none;user-select:none}
  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);
    padding:22px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:11px}
  button.mic{display:flex;align-items:center;gap:11px;background:var(--accent);color:#1c1204;border:0;
    font-family:var(--font);font-size:15px;font-weight:650;padding:15px 30px;border-radius:999px;cursor:pointer;
    transition:transform .15s,box-shadow .2s,background .2s;box-shadow:0 8px 28px rgba(232,161,58,.24)}
  button.mic:hover{transform:translateY(-1px)}
  button.mic:disabled{opacity:.55;cursor:default;transform:none}
  button.mic.on{background:var(--warm);color:#fff;box-shadow:0 8px 28px rgba(224,112,90,.26)}
  button.mic svg{width:17px;height:17px}
  .settings .off{opacity:.45;pointer-events:none}
  button.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--font);
    font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;order:2}
  button.ghost:hover{color:var(--text);border-color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark">🍜</div>
      <div>
        <h1>YuanYuan AI &mdash; cook along with me</h1>
        <div class="sub"><b>圓圓</b> &middot; your hands are wet, and cooking alone is boring &middot; 手是濕的，而且一個人煮飯很無聊</div>
      </div>
    </div>
    <div class="headright">
      <div class="pill" id="stage"><span>Stage 階段</span><b id="stageText">idle</b></div>
      <div class="pill"><span class="dot" id="dot"></span><span id="statusText">Not connected 未連線</span></div>
    </div>
  </header>

  <div class="prog" id="prog"><i id="progFill"></i></div>

  <div class="now">
    <div class="dish" id="dish"></div>
    <div class="timer" id="timer">
      <div class="ring">
        <svg width="68" height="68"><circle class="bgc" cx="34" cy="34" r="29"></circle><circle class="fgc" id="ringFg" cx="34" cy="34" r="29"></circle></svg>
        <div class="num" id="ringNum">0:00</div>
      </div>
      <div class="label"><b id="timerState">Waiting 等待中</b><span id="timerLabel"></span><span class="zh" id="timerLabelZh"></span></div>
    </div>
  </div>

  <div class="feed" id="feed"></div>
  <div class="menu" id="menu"></div>
  <div class="err" id="err"></div>

</div>

<div class="bar">
  <div class="turn" id="turn" hidden><span class="ring"></span><b id="turnText"></b><span class="zh" id="turnZh"></span><span class="meter"><i id="meterFill"></i></span></div>
  <button class="ghost" id="newChat" title="Forget what we were doing and start clean">新對話 New chat</button>
  <button class="mic" id="micBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
    </svg>
    <span id="micLabel">Start talking 開始說話</span>
  </button>
</div>

<script>
/* ---------------------------------------------------------------
   YuanYuan AI — a voice companion that cooks with you.

   The screen is deliberately almost empty. A cook with wet hands does
   not read a recipe off a monitor; the steps live in the agent's head,
   and what you see is the conversation, the clock, and how far along
   you are. Everything else was taking up room for nothing.
   --------------------------------------------------------------- */

const AGENT_WS       = "wss://agents.assemblyai.com/v1/ws";
const TOKEN_ENDPOINT = "/api/voice-token";
const SAMPLE_RATE    = 24000;   // the Voice Agent API speaks PCM16 @ 24 kHz
const CHUNK_MS       = 50;

/* ---- the recipe book ------------------------------------------
   Three recipes, hand-written, with a Chinese line for every step and
   something useful to suggest during each dead gap. None of this is
   rendered — the agent reads it through the tools and says it out loud.
   --------------------------------------------------------------- */

const RECIPES = [
  {
    id:"noodles", zh:"泡麵升級版", en:"Upgraded Instant Noodles", minutes:12,
    blurb:"The one you already know, made worth sitting down for.",
    blurbZh:"你早就會的那碗，煮到值得坐下來好好吃。",
    keys:["泡麵","麵","雞蛋","蛋","青菜","蔥","辣油","noodle","noodles","egg","greens","scallion","instant"],
    ingredients:[
      { zh:"泡麵 1 包", en:"1 pack instant noodles" },
      { zh:"雞蛋 1 顆", en:"1 egg" },
      { zh:"青菜 一把", en:"A handful of leafy greens" },
      { zh:"蔥花 適量", en:"Chopped scallion" },
      { zh:"辣油 一匙", en:"A spoon of chilli crisp" }
    ],
    steps:[
      { text:"Pour 500ml of water into a small pot, lid on, high heat.",
        zh:"小鍋裝 500 毫升水，蓋上蓋子，開大火。",
        wait:180, label:"Water coming to a boil", labelZh:"等水滾",
        tip:"Good time to wash the greens and get the egg out.",
        tipZh:"趁現在洗菜、把蛋拿出來。" },
      { text:"Water's up. Drop the noodle block in and leave it alone — no seasoning yet.",
        zh:"水滾了。麵餅放下去就別動它，調味包先不要加。",
        wait:90, label:"Noodles softening", labelZh:"等麵變軟",
        tip:"You could wipe the counter down while we wait.",
        tipZh:"可以順手把流理台擦一擦。" },
      { text:"Crack the egg straight onto the noodles. Don't stir it, let it set.",
        zh:"蛋直接打在麵上面，不要攪，讓它自己凝固。",
        wait:60, label:"Egg setting", labelZh:"等蛋凝固",
        tip:"Get your bowl and chopsticks ready now.",
        tipZh:"先把碗筷準備好。" },
      { text:"Now the sachets — but only half the oil packet. Trust me on that one.",
        zh:"現在加調味包，但油包只加一半，相信我。" },
      { text:"Greens in, then kill the heat. They'll cook in the heat that's left.",
        zh:"青菜丟進去，然後關火，餘溫就會把它燙熟。",
        wait:30, label:"Greens wilting", labelZh:"等青菜變軟",
        tip:"Rinse the knife and board now — less to do after.",
        tipZh:"刀跟砧板先沖一下，等等就不用忙。" },
      { text:"Into a bowl. Scallion on top, a spoon of chilli crisp. That's dinner.",
        zh:"盛進碗裡，撒上蔥花，加一匙辣油。晚餐好了。" }
    ]
  },
  {
    id:"tomato_egg", zh:"番茄炒蛋", en:"Tomato Egg Stir-fry", minutes:15,
    blurb:"The dish every kitchen in Taiwan can make blindfolded.",
    blurbZh:"台灣每個廚房閉著眼睛都會做的一道。",
    keys:["番茄","蕃茄","雞蛋","蛋","蔥","糖","鹽","tomato","tomatoes","egg","eggs","sugar","scallion"],
    ingredients:[
      { zh:"番茄 2 顆（切塊）", en:"2 tomatoes, in wedges" },
      { zh:"雞蛋 3 顆", en:"3 eggs" },
      { zh:"蔥花 適量", en:"Chopped scallion" },
      { zh:"糖 一小撮", en:"A pinch of sugar" },
      { zh:"鹽 適量", en:"Salt" }
    ],
    steps:[
      { text:"Beat three eggs with a pinch of salt until it's all one colour.",
        zh:"三顆蛋加一點鹽打散，打到顏色均勻。" },
      { text:"Hot pan, generous oil. Egg in, push it around until it's just set, then take it straight out.",
        zh:"鍋燒熱、油多一點。蛋下鍋推到剛凝固就馬上盛起來。" },
      { text:"Same pan, tomato wedges in. Don't touch them — let them collapse on their own.",
        zh:"同一個鍋，番茄下鍋。不要翻動，讓它自己出水軟掉。",
        wait:120, label:"Tomatoes breaking down", labelZh:"等番茄出水軟掉",
        tip:"Wash the egg bowl while those break down.",
        tipZh:"趁這時候把打蛋的碗洗掉。" },
      { text:"A pinch of sugar now. That's the trick — it takes the sourness off.",
        zh:"這時候加一小撮糖，這是關鍵，可以把酸味壓下去。" },
      { text:"Egg back in, fold it through twice, scallion on top, off the heat.",
        zh:"蛋倒回去，翻拌兩下，撒蔥花，關火。" }
    ]
  },
  {
    id:"garlic_rice", zh:"蒜香奶油炒飯", en:"Garlic Butter Fried Rice", minutes:10,
    blurb:"Yesterday's rice, and four cloves of garlic doing all the work.",
    blurbZh:"隔夜飯，加四瓣蒜就搞定。",
    keys:["飯","冷飯","白飯","蒜","蒜頭","奶油","醬油","蔥","蛋","雞蛋","rice","garlic","butter","soy","scallion","egg"],
    ingredients:[
      { zh:"冷飯 2 碗", en:"2 bowls day-old rice" },
      { zh:"蒜頭 4 瓣（切末）", en:"4 cloves garlic, chopped" },
      { zh:"奶油 一大塊", en:"A big knob of butter" },
      { zh:"醬油 適量", en:"Soy sauce" },
      { zh:"雞蛋 1 顆", en:"1 egg" },
      { zh:"蔥花 適量", en:"Chopped scallion" }
    ],
    steps:[
      { text:"Melt a big knob of butter on medium heat, then slide the chopped garlic in.",
        zh:"中火融一大塊奶油，然後把蒜末滑進去。",
        wait:60, label:"Garlic going golden", labelZh:"等蒜變金黃",
        tip:"Get the soy sauce and scallion within reach.",
        tipZh:"把醬油跟蔥花先拿到手邊。" },
      { text:"Garlic's golden — rice in. Break every clump with the back of the spoon.",
        zh:"蒜變金黃了，飯下鍋。用鍋鏟背面把飯粒壓散。",
        wait:90, label:"Rice frying", labelZh:"炒飯中",
        tip:"Clear the chopping board — you're nearly done.",
        tipZh:"把砧板收一收，快好了。" },
      { text:"Push the rice to one side, crack the egg into the gap, scramble it there, then mix it through.",
        zh:"飯撥到一邊，蛋打進空位炒散，再跟飯拌勻。" },
      { text:"Soy sauce down the hot side of the pan, not onto the rice. You'll hear it.",
        zh:"醬油沿著鍋邊淋，不要直接倒在飯上，你會聽到滋一聲。" },
      { text:"Scallion, one last toss, and it's done.",
        zh:"撒蔥花，最後翻一下，完成。" }
    ]
  },
  {
    id:"pan_chicken", zh:"香煎雞腿排", en:"Pan-seared Chicken Thigh", minutes:18,
    blurb:"Almost no work. Almost all waiting. Crispiest skin you will make at home.",
    blurbZh:"幾乎不用動手，幾乎都在等。你在家能煎出最脆的一次雞皮。",
    keys:["雞腿","雞腿排","雞排","雞肉","雞","去骨雞腿","chicken","thigh","chicken thigh","drumstick"],
    ingredients:[
      { zh:"去骨雞腿排 1 片", en:"1 boneless chicken thigh" },
      { zh:"鹽 適量", en:"Salt" },
      { zh:"黑胡椒 適量", en:"Black pepper" }
    ],
    steps:[
      { text:"Pat the thigh really dry with kitchen paper, then salt both sides and leave it on the counter.",
        zh:"雞腿排用廚房紙巾徹底擦乾，兩面抹鹽，就放在檯面上別動。",
        wait:300, label:"Salt drawing out moisture", labelZh:"等鹽把水分逼出來",
        tip:"Put your pan on the lowest heat now — a slowly heated pan is the whole trick.",
        tipZh:"現在把鍋子放上去開最小火，鍋子慢慢熱起來就是整道菜的訣竅。" },
      { text:"Wipe the thigh dry one more time, then lay it skin side down in the pan. Medium heat. Now do not touch it.",
        zh:"再擦一次乾，皮朝下放進鍋子，轉中火。接下來完全不要碰它。",
        wait:360, label:"Skin crisping", labelZh:"等雞皮變脆",
        tip:"Six whole minutes with your hands free. Do not lift it to peek — that is what ruins the skin.",
        tipZh:"整整六分鐘手是空的。千萬別掀起來偷看，雞皮就是這樣毀掉的。" },
      { text:"Flip it. The skin side is done — the rest is easy.",
        zh:"翻面。雞皮那面已經完成了，剩下的很輕鬆。",
        wait:240, label:"Cooking through", labelZh:"等裡面熟透",
        tip:"Grind some black pepper over it while it finishes.",
        tipZh:"趁現在磨一點黑胡椒撒上去。" },
      { text:"Onto a plate, and leave it alone. I know it smells ready. It is not ready.",
        zh:"夾到盤子上放著別動。我知道聞起來好了，但還沒好。",
        wait:180, label:"Resting", labelZh:"靜置中",
        tip:"Most people skip this and all the juice runs out on the board. Three minutes.",
        tipZh:"大家都跳過這步，然後肉汁全流到砧板上。就三分鐘。" },
      { text:"Slice it thick, against the grain. Done.",
        zh:"逆紋切厚片。完成。" }
    ]
  },
  {
    id:"three_cup", zh:"三杯雞", en:"Three-cup Chicken", minutes:25,
    blurb:"The smell alone will bring someone into the kitchen.",
    blurbZh:"光是那個味道就會把人從房間裡吸過來。",

const STAGE_ZH = { idle:"待命", picking:"選菜", prep:"備料", cooking:"下鍋", waiting:"等待", done:"完成" };

/* ---- state ----------------------------------------------------- */

const STORE_KEY = "yuanyuan.cook.v4";

/* What was said before. Pressing the button opens a brand new session with the
   API, and a session starts with no history at all — which is why it used to
   forget everything the moment they stopped and started again. So we keep the
   conversation here and hand the last stretch of it back to the new session in
   its instructions. Only the last stretch: a whole evening of chatter pasted
   into a prompt is how an agent starts contradicting itself. */
const MEMORY_TURNS = 12, MEMORY_CHARS = 160;
let convoLog = [];

function remember(who, text){
  const t = String(text || "").trim();
  if(!t) return;
  convoLog.push({ who, t: t.slice(0, MEMORY_CHARS) });
  if(convoLog.length > MEMORY_TURNS * 2) convoLog = convoLog.slice(-MEMORY_TURNS * 2);
  saveState();
}

function memoryBlock(){
  const lines = convoLog.slice(-MEMORY_TURNS * 2)
    .map(x => (x.who === "you" ? "- them: " : "- you: ") + x.t);
  if(!lines.length && !recipe) return "";
  let where = "";
  if(recipe){
    where = stepIdx >= recipe.steps.length
      ? `\nWhere things stand: they finished ${recipe.en} (${recipe.zh}).`
      : `\nWhere things stand: ${recipe.en} (${recipe.zh}), step ${stepIdx + 1} of ${recipe.steps.length}. The clock is not running.`;
  }
  return `

EARLIER IN THIS KITCHEN — you were already talking to them:
${lines.join("\n")}${where}
Carry straight on from this. Do not read it back to them, do not greet them like a
stranger, and do not start the dish again from the top. If they pick up mid-sentence,
they mean the sentence above.`;
}
let stage = "idle", recipe = null, stepIdx = -1, matched = [];
let pendingRecipe = null;   // chosen, ingredients read out, not started yet

function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({ id: recipe && recipe.id, stepIdx, convo: convoLog })); }catch(e){}
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(!s) return;
    if(Array.isArray(s.convo)) convoLog = s.convo.slice(-MEMORY_TURNS * 2);
    const r = RECIPES.find(x => x.id === s.id);
    if(r && s.stepIdx >= 0 && s.stepIdx < r.steps.length){ recipe = r; stepIdx = s.stepIdx; stage = "cooking"; }
  }catch(e){}
}

const dishEl      = document.getElementById("dish");
const menuEl      = document.getElementById("menu");
const progEl      = document.getElementById("prog");
const progFill    = document.getElementById("progFill");
const feedEl      = document.getElementById("feed");
const errEl       = document.getElementById("err");
const dotEl       = document.getElementById("dot");
const statusEl    = document.getElementById("statusText");
const stageEl     = document.getElementById("stage");
const stageTextEl = document.getElementById("stageText");
const micBtn      = document.getElementById("micBtn");
const micLabel    = document.getElementById("micLabel");
const timerEl     = document.getElementById("timer");
const ringFg      = document.getElementById("ringFg");
const ringNum     = document.getElementById("ringNum");
const timerLabel  = document.getElementById("timerLabel");
const timerLabelZh= document.getElementById("timerLabelZh");
const timerState  = document.getElementById("timerState");

const RING_LEN = 2 * Math.PI * 29;
ringFg.style.strokeDasharray = RING_LEN;
ringFg.style.strokeDashoffset = RING_LEN;

/* ---- rendering -------------------------------------------------- */

function setStage(s){
  stage = s;
  stageEl.className = "pill " + s;
  stageTextEl.textContent = s + " " + (STAGE_ZH[s] || "");
  render();
}

function render(){
  if(!recipe){
    progEl.classList.remove("on");
    dishEl.innerHTML = `
      <div class="idle">Tell me what you feel like eating — or read out what's in the fridge.
        <span class="zhline">跟我說你想吃什麼，或直接報冰箱裡有什麼，我幫你挑。</span>
      </div>`;
    // The book is not on the screen. They talk, it answers — nothing to read.
    menuEl.innerHTML = "";
    return;
  }
  menuEl.innerHTML = "";
  const done = stepIdx >= recipe.steps.length;
  progEl.classList.add("on");
  progFill.style.width = Math.round(100 * Math.min(stepIdx, recipe.steps.length) / recipe.steps.length) + "%";
  dishEl.innerHTML = `
    <div class="zh">${recipe.zh}</div>
    <div class="en">${recipe.en}${done ? " &middot; done 完成" : ""}</div>`;
}

/* The conversation. English on top, Traditional Chinese underneath, in
   one block — the agent sends the Chinese a beat before it speaks, so we
   hold it and pair it with the line when the line arrives. */

let pendingZh = null;

function say(who, en, cls, zh){
  const div = document.createElement("div");
  div.className = "line " + (cls || "");
  div.innerHTML = `<span class="who">${who}</span><span class="body"><span class="en"></span><span class="zh"></span></span>`;
  div.querySelector(".en").textContent = en;
  if(zh) div.querySelector(".zh").textContent = zh;
  feedEl.appendChild(div);
  feedEl.scrollTop = feedEl.scrollHeight;
  return div;
}

let partialLine = null;
function showPartial(text){
  if(!partialLine) partialLine = say("YOU", text, "you partial");
  else partialLine.querySelector(".en").textContent = text;
  feedEl.scrollTop = feedEl.scrollHeight;
}
function commitPartial(text){
  if(partialLine){
    partialLine.classList.remove("partial");
    partialLine.querySelector(".en").textContent = text;
    partialLine = null;
  } else say("YOU", text, "you");
  remember("you", text);
}

let agentLine = null, agentBuf = "";
function agentLineEl(){
  if(!agentLine){
    agentLine = say("圓圓", "", "partial");
    if(pendingZh){ agentLine.querySelector(".zh").textContent = pendingZh; pendingZh = null; }
  }
  return agentLine;
}
function showAgentPartial(text){
  agentLineEl().querySelector(".en").textContent = text;
  feedEl.scrollTop = feedEl.scrollHeight;
}
function commitAgent(text){
  remember("yuan", text);
  if(agentLine || text){
    const el = agentLineEl();
    el.classList.remove("partial");
    el.querySelector(".en").textContent = text;
  }
  agentLine = null;
  agentBuf = "";
}

/* The Chinese arrives first, from the tool call. Park it; the spoken line
   is a moment behind and will collect it. */
function subtitle(zh){
  if(!zh) return;
  if(agentLine) agentLine.querySelector(".zh").textContent = zh;
  else pendingZh = zh;
  feedEl.scrollTop = feedEl.scrollHeight;
}

function setStatus(text, state){
  statusEl.textContent = text;
  dotEl.className = "dot" + (state ? " " + state : "");
}
function showError(msg){ errEl.textContent = msg; }

/* The microphone level, drawn on screen. Without it there is no way to tell
   "the room is too quiet for it" apart from "it heard me and ignored me". */
let levelPeak = 0;
function setLevel(v){
  const el = document.getElementById("meterFill");
  if(!el) return;
  if(v < 0){ levelPeak = 0; el.style.width = "0%"; return; }
  levelPeak = Math.max(levelPeak * 0.8, Math.min(1, v * 3.2));
  el.style.width = Math.round(levelPeak * 100) + "%";
}

/* Whose turn it is. On speakers the microphone is closed while the agent
   speaks — there is no way to know that from the outside, so say it out loud
   on screen. Not knowing was why half of what they said went missing. */
function setTurn(who){
  const el = document.getElementById("turn");
  // Before session.ready there is nothing to take turns with — a green light
  // there tells them to start talking into a connection that does not exist.
  if(!who || !running){ el.hidden = true; return; }
  el.hidden = false;
  el.className = "turn " + who;
  document.getElementById("turnText").textContent =
    who === "agent" ? "YuanYuan is speaking" : "Your turn";
  document.getElementById("turnZh").textContent =
    who === "agent" ? "圓圓說話中 · 麥克風暫停"
                    : "輪到你了 · 慢慢講，停頓沒關係";
}

/* ---- the timer --------------------------------------------------
   Waiting is the feature, not dead air. When it ends the agent speaks
   first — that is the whole product, so it is not optional.
   ------------------------------------------------------------------ */

let timerId = null, timerEnd = 0, timerTotal = 0;

function startTimer(seconds, label, labelZh){
  clearTimer();
  timerTotal = Math.max(1, Math.round(seconds));
  timerEnd = Date.now() + timerTotal * 1000;
  timerLabel.textContent = label || "";
  timerLabelZh.textContent = labelZh || "";
  timerState.textContent = "Waiting 等待中";
  timerEl.classList.add("on");
  timerEl.classList.remove("rang");
  tickTimer();
  timerId = setInterval(tickTimer, 250);
  setStage("waiting");
}

function tickTimer(){
  const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
  const m = Math.floor(left / 60), s = left % 60;
  ringNum.textContent = m + ":" + String(s).padStart(2, "0");
  ringFg.style.strokeDashoffset = RING_LEN * (1 - left / timerTotal);
  if(left <= 0) ringTimer();
}

function ringTimer(){
  clearInterval(timerId); timerId = null;
  timerEl.classList.add("rang");
  timerState.textContent = "Time's up 時間到";
  const rangAt = Date.now();
  chime();
  say("TIMER", (timerLabel.textContent || "Timer") + " — done", "act",
      (timerLabelZh.textContent || "計時") + " — 時間到");
  if(stage === "waiting") setStage("cooking");
  // Let the beeping finish before Yuan AI speaks, so its voice is not buried
  // under the alarm. If they already said something while it rang, it is
  // their conversation now — do not talk over them.
  setTimeout(() => { if(lastUserAt < rangAt) nudge(); }, CHIME_SECONDS * 1000);
}

function clearTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
  timerEl.classList.remove("on","rang");
}

/* A kitchen timer going off: three sharp beeps every second, for five
   seconds — long enough to hear from the sink with the fan on.

   It rides the playback context on purpose. A fresh AudioContext created here
   starts suspended, because a timer finishing is not a user gesture — that is
   a silent chime on every phone. playCtx is already running. */
const CHIME_SECONDS = 5;
let lastUserAt = 0;

function chime(){
  try{
    const c = playCtx || new AudioContext();
    if(c.state === "suspended") c.resume();
    const t0 = c.currentTime + 0.05;
    for(let n = 0; n < CHIME_SECONDS * 3; n++){
      const o = c.createOscillator(), g = c.createGain();
      o.type = "square"; o.frequency.value = 2000;
      o.connect(g); g.connect(c.destination);
      const t = t0 + Math.floor(n / 3) + (n % 3) * 0.22;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.34, t + 0.008);
      g.gain.setValueAtTime(0.34, t + 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.start(t); o.stop(t + 0.16);
    }
    if(c !== playCtx) setTimeout(() => { try{ c.close(); }catch(e){} }, CHIME_SECONDS * 1000 + 600);
  }catch(e){}
}

/* ---- the six things it can do ----------------------------------- */

function findRecipe(name){
  if(!name) return null;
  const q = String(name).toLowerCase().trim();
  return RECIPES.find(r =>
    r.id === q || r.zh === name || r.en.toLowerCase() === q ||
    r.en.toLowerCase().includes(q) || r.zh.includes(name) || q.includes(r.en.toLowerCase())
  ) || null;
}

function stepPayload(){
  if(!recipe) return { error:"No recipe started yet. Call start_recipe first." };
  if(stepIdx >= recipe.steps.length) return { finished:true, dish:recipe.en, message:"All steps are done." };
  const s = recipe.steps[stepIdx];
  return {
    dish: recipe.en,
    step_number: stepIdx + 1,
    of: recipe.steps.length,
    instruction: s.text,
    instruction_zh: s.zh,
    timer_running: !!timerId,
    timer_seconds: s.wait || 0,
    timer_started: false,
    timer_note: s.wait
      ? "Read the step out, then stop and let them ask. The clock is NOT running: call start_step_timer only when they say they have actually started."
      : "No timer on this step. Read it out, then stop and let them ask.",
    waiting_suggestion: s.tip || "",
    waiting_suggestion_zh: s.tipZh || "",
    stage
  };
}

  scallion_egg:{meal:["breakfast","lunch"],skill:1,taste:["light","savoury"],serves:2},
  cabbage:{meal:["lunch","dinner"],skill:1,taste:["light","sweet"],serves:3},
  water_spinach:{meal:["lunch","dinner"],skill:1,taste:["light"],serves:2},
  tomato_soup:{meal:["lunch","dinner"],skill:1,taste:["light","sour"],serves:3},
  luffa_clam:{meal:["lunch","dinner"],skill:1,taste:["light","sweet"],serves:3},
  basil_eggplant:{meal:["lunch","dinner"],skill:2,taste:["rich","savoury"],serves:3},

  onion_egg:{meal:["breakfast","lunch","dinner"],skill:1,taste:["sweet","light"],serves:2},
  steamed_egg:{meal:["breakfast","lunch","dinner","snack"],skill:1,taste:["light"],serves:3},
  cucumber:{meal:["lunch","dinner","snack"],skill:1,taste:["sour","light"],serves:3},
  curry:{meal:["lunch","dinner"],skill:2,taste:["rich"],serves:4},
  braised_tofu:{meal:["lunch","dinner"],skill:1,taste:["savoury"],serves:3},
  beef_scallion:{meal:["dinner"],skill:2,taste:["savoury","rich"],serves:3},
  sweet_sour_ribs:{meal:["dinner"],skill:3,taste:["sweet","sour","rich"],serves:4},
  chicken_soup:{meal:["lunch","dinner"],skill:1,taste:["light"],serves:4},
  daikon_soup:{meal:["lunch","dinner"],skill:1,taste:["light"],serves:4},
  congee:{meal:["breakfast","snack","lunch"],skill:1,taste:["light"],serves:3},
  fried_noodles:{meal:["breakfast","lunch","dinner"],skill:2,taste:["savoury"],serves:4},
  pepper_pork:{meal:["lunch","dinner"],skill:1,taste:["savoury"],serves:3},
  soy_chicken:{meal:["lunch","dinner"],skill:2,taste:["savoury","rich"],serves:3}
};
const SKILL_LEVEL = { never:1, beginner:1, some:2, ok:2, confident:3, good:3 };

const TOOLS = {
  /* They do not know what to make. Ask them the four things first, then call this. */
  recommend_dishes({ meal, people, taste, skill, minutes }){
    const want = String(taste || "").toLowerCase().split(/[,、\s]+/).filter(Boolean);
    const cap = SKILL_LEVEL[String(skill || "").toLowerCase()] || (Number(skill) || 3);
    const mouths = Number(people) || 0;
    const mins = Number(minutes) || 0;
    const scored = RECIPES.map(r => {
      const t = DISH_TAGS[r.id];
      if(!t) return null;
      if(t.skill > cap) return null;                                  // beyond them today
      if(meal && t.meal.indexOf(String(meal).toLowerCase()) === -1) return null;
      if(mins && r.minutes > mins) return null;
      let score = 0;
      for(const w of want) if(t.taste.some(x => x.indexOf(w) !== -1 || w.indexOf(x) !== -1)) score += 2;
      if(mouths){ score += (t.serves >= mouths ? 1 : -2 * (mouths - t.serves)); }
      score += (3 - t.skill) * 0.5;
      return { r, t, score };
    }).filter(Boolean).sort((a,b) => b.score - a.score).slice(0, 3);

    if(!scored.length) return { matches:[], message:"Nothing fits all of that. Loosen one thing — ask whether they mind it taking longer, or whether the meal matters." };
    matched = scored.map(x => x.r.id);
    setStage("picking");
    say("PICK", scored.map(x => x.r.en).join(", "), "act", "推薦：" + scored.map(x => x.r.zh).join("、"));
    return { matches: scored.map(x => ({ dish:x.r.en, dish_zh:x.r.zh, minutes:x.r.minutes,
               serves:x.t.serves, easy: x.t.skill === 1, why:x.r.blurb, why_zh:x.r.blurbZh })),
             message:"Offer two of these in one short line each. When they pick one, call prep_list." };
  },

  suggest_dishes({ have }){
    const list = Array.isArray(have) ? have : String(have || "").split(/[,、\s]+/);
    const words = list.map(x => String(x).toLowerCase().trim()).filter(Boolean);
    const scored = RECIPES.map(r => {
      // Substring matching on Mandarin is too eager: 洋蔥 contains 蔥, so an onion
      // used to match every dish with scallion in it. One-character keys must match exactly.
      const hits = r.keys.filter(k => {
        const kk = k.toLowerCase();
        return words.some(w =>
          w === kk ||
          (kk.length >= 2 && w.includes(kk)) ||
          (w.length  >= 2 && kk.includes(w)));
      });
      return { r, score: new Set(hits).size };
    }).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0,3);

    matched = scored.map(x => x.r.id);
    setStage("picking");

    if(!scored.length) return { matches: [], message: "Nothing matches. Offer the three dishes by name.", book: RECIPES.map(r => r.en) };
    say("MATCH", scored.map(x => x.r.en).join(", "), "act", "配對到：" + scored.map(x => x.r.zh).join("、"));
    return { matches: scored.map(x => ({ dish:x.r.en, dish_zh:x.r.zh, minutes:x.r.minutes })) };
  },

  /* Before any cutting or heating: what they need on the counter. The steps
     do not start here — they start when they say they have it all. */
  prep_list({ dish }){
    const r = findRecipe(dish);
    if(!r) return { in_book:false, dish,
                    message:"Not in the book. Work the ingredient list out yourself, read it to them and ask what they have — never tell them you have not made it. Once they are ready, call improvise_recipe.",
                    book: RECIPES.map(x => x.en) };
    pendingRecipe = r; recipe = null; stepIdx = -1; matched = [];
    clearTimer(); setStage("prep");
    say("PREP", r.en + " — " + r.ingredients.length + " things to get out", "act",
        r.zh + " — 要準備 " + r.ingredients.length + " 樣：" + r.ingredients.map(i => i.zh).join("、"));
    return { in_book:true, dish:r.en, dish_zh:r.zh, minutes:r.minutes, total_steps:r.steps.length,
             ingredients: r.ingredients.map(i => ({ en:i.en, zh:i.zh })),
             message:"Read this list out in one short breath and ask what they are missing. Offer a substitute for anything they do not have. Call start_recipe only once they say they are ready." };
  },

  start_recipe({ dish }){
    const r = findRecipe(dish) || pendingRecipe;
    if(!r) return { error:`"${dish}" is not in the book. Do not push them onto another dish and never say you have not made it — call prep_list first, then improvise_recipe once they have what they need.`,
                    book: RECIPES.map(x => x.en) };
    recipe = r; stepIdx = 0; matched = []; pendingRecipe = null;
    clearTimer(); setStage("cooking"); saveState();
    say("RECIPE", r.en + " — " + r.steps.length + " steps", "act", r.zh + " — 共 " + r.steps.length + " 步");
    return { dish:r.en, dish_zh:r.zh, total_steps:r.steps.length,
             ingredients:r.ingredients.map(i => i.en), ...stepPayload() };
  },

  next_step(){
    if(!recipe) return { error:"Nothing is cooking yet. Ask what they want to make." };
    if(stepIdx >= recipe.steps.length) return { finished:true, message:"Already finished." };
    stepIdx += 1; saveState();
    if(stepIdx >= recipe.steps.length){
      clearTimer(); setStage("done");
      say("RECIPE", recipe.en + " — finished", "act", recipe.zh + " — 完成");
      return { finished:true, dish:recipe.en, message:"That was the last step. Tell them it's ready, briefly." };
    }
    clearTimer(); setStage("cooking");
    return stepPayload();
  },

  repeat_step(){ return stepPayload(); },

  /* A dish the book does not have. The agent works the whole thing out and
     hands it over in the same shape as a written recipe, so the timer, the
     stages, the Chinese subtitles and the waiting chat all keep working —
     none of that machinery can tell the difference. */
  improvise_recipe({ dish, dish_zh, minutes, ingredients, steps }){
    const list = Array.isArray(steps) ? steps : [];
    if(!dish) return { error:"What is the dish called? Ask them." };
    if(!list.length) return { error:"No steps came through. Work out the steps first, then call this once with all of them." };

    const clean = list.slice(0, 12).map(x => ({
      text:    String(x && x.text || "").trim(),
      zh:      String(x && x.zh   || "").trim(),
      wait:    Math.min(3600, Math.max(0, Math.round(Number(x && x.wait) || 0))),
      label:   String(x && x.label    || "Cooking"),
      labelZh: String(x && x.label_zh || "烹調中"),
      tip:     String(x && x.tip      || ""),
      tipZh:   String(x && x.tip_zh   || "")
    })).filter(x => x.text);
    if(!clean.length) return { error:"Those steps came through empty. Say them again." };

    recipe = {
      id:"improvised", improvised:true,
      en: String(dish), zh: String(dish_zh || dish),
      minutes: Math.max(0, Math.round(Number(minutes) || 0)),
      ingredients: (Array.isArray(ingredients) ? ingredients : []).map(i => ({
        en: String(i && i.en || i || ""), zh: String(i && i.zh || i && i.en || i || "") })),
      steps: clean
    };
    stepIdx = 0; matched = []; pendingRecipe = null;
    clearTimer(); setStage("cooking"); saveState();
    say("RECIPE", recipe.en + " — " + clean.length + " steps · improvised",
        "act", recipe.zh + " — 共 " + clean.length + " 步 · 即席");

    return { dish:recipe.en, dish_zh:recipe.zh, total_steps:clean.length, improvised:true,
             ingredients: recipe.ingredients.map(i => i.en), ...stepPayload() };
  },

  // Called BEFORE the spoken reply, never after. A tool result always prompts
  // a new turn from the model, so a subtitle tool called after speaking makes
  // the agent answer itself forever.
  show_subtitle({ zh }){
    const t = String(zh || "").trim();
    if(!t) return { error:"Nothing to show. Pass the Traditional Chinese text." };
    subtitle(t);
    return { ok:true, now:"Say that same line in English, then stop and wait for them." };
  },

  /* The clock starts when they say they have started — not when the step is
     read out. Somebody who has never made this asks two or three questions
     first, and a timer running through that is a timer that lies. */
  start_step_timer(){
    if(!recipe) return { error:"Nothing is cooking yet." };
    const s = recipe.steps[stepIdx];
    if(!s) return { error:"No step is open." };
    if(!s.wait) return { timer_running:false, message:"This step has no waiting in it. Ask them to tell you when it is done." };
    startTimer(s.wait, s.label, s.labelZh);
    return { timer_running:true, seconds:s.wait, stage };
  },

  set_timer({ seconds, label, label_zh }){
    const n = Math.round(Number(seconds) || 0);
    if(!n || n < 1) return { error:"How long? Ask them for a number." };
    if(n > 3600) return { error:"That is longer than an hour — check the number with them." };
    startTimer(n, label || "Timer", label_zh || "計時");
    return { timer_running:true, seconds:n, stage };
  }
};

const TOOL_SCHEMA = [
  { type:"function", name:"suggest_dishes",
    description:"Match what they have in the fridge against the recipe book. Call this when they list ingredients instead of naming a dish.",
    parameters:{ type:"object", properties:{
      have:{ type:"array", items:{ type:"string" }, description:"Ingredients they said they have, e.g. ['雞蛋','番茄']" }
    }, required:["have"] } },

    parameters:{ type:"object", properties:{

function systemPrompt(){
  const replyRule = "- Keep every answer to one or two short sentences.";

  return `You are Yuan AI, a friend who cooks along with one person in their kitchen at home.
Your name is Yuan AI. Whenever you say your name, in any language, say exactly "Yuan AI".
Their hands are wet or greasy, so your voice is the only way they can reach you.
You are here for company first and instructions second. Cooking alone is boring — you are the friend leaning on the counter.

BE QUICK:
Answer the instant they stop talking. No warm-up words ("okay, so", "great question"), no repeating
back what they just said, no announcing what you are about to do. Lead with the useful part.
Short and immediate beats complete.

NOTHING IS ON THEIR SCREEN. They cannot read the recipe; you are holding it for them.
So never say "as you can see" or "look at the step". Say it out loud, plainly, and only one step at a time.

Your tone follows the stage that the tools hand back:
- picking: warm and easy. Two options at most. If they list what is in the fridge, call suggest_dishes.
- cooking: calm and steady. One step, then stop talking and let them work.
- waiting: a timer is running and their hands are free. This is what you are for.
  Offer the waiting_suggestion the tool gave you — something small and useful, like wiping the
  counter or getting the bowl out — and then just talk to them. Ask about their day, tell a small
  story about food, react to what they say. Do NOT announce the countdown, do NOT push them on.
- done: proud of them for a sentence, then get out of the way.

LET THEM FINISH:
They are cooking, so they stop mid-sentence to look in a pan or to think. Assume there is
more coming. Before you say anything, ask yourself whether that could be the first half of
a sentence: it names no dish and no ingredient, it asks nothing, it trails off on "and",
"then", "I want to", "can we", or it is a single stray word. If so, you have not heard them
yet. Say one short sound — "Mm-hm?" — or nothing at all, and wait. Never guess the rest,
never answer half a sentence, and never start a new subject of your own while they are
mid-sentence.
The only reason to cut in without waiting is danger: something burning, oil catching fire,
a pot boiling over, or they ask you to stop. Then speak immediately and keep it to a few words.

WHEN THEY DO NOT KNOW WHAT TO MAKE:
"I don't know", "whatever", "you decide", or just a tired sigh. Do not fire a list of
dishes at them and do not ask everything at once. One short question at a time, three at
most, and skip any they have already answered:
1. Which meal is it — breakfast, lunch, dinner, or something small to pick at?
2. How many of you are eating?
3. What do you feel like — something light, something rich, something spicy, a soup?
If you cannot tell how much cooking they have done, that is a fourth: have you cooked
much before, or shall I keep it simple? Then call recommend_dishes with what they said
and offer two of what comes back, one short line each, and let them choose. Once they
pick, it is prep_list as usual.

THE MOMENT THEY NAME A DISH — INGREDIENTS FIRST, ALWAYS:
Nobody wants to be told to heat the pan and then find out the garlic ran out. So:
1. Call prep_list with the dish. It hands you everything they need.
2. Read the list out in one short breath — the whole list, quantities included — and ask
   what they are missing. Nothing else in that turn. No steps yet.
3. They answer. Go through what they said against the list and say plainly what is missing.
4. Missing something? Offer the way round it, do not send them to the shop and do not
   quietly change the dish. The usual swaps:
   - no rice wine: use any cooking wine, or leave it out
   - no sesame oil: any oil; no butter: oil
   - no rock sugar: ordinary sugar; no black vinegar: any vinegar with a pinch of sugar
   - no shallots: onion; no Thai basil: leave it out, it is smell not structure
   - no bonito flakes: stock powder, or just salt
   - no cornflour: potato starch, or skip the marinade coating
   - a vegetable missing: any other vegetable of the same kind goes in
   Only when the main thing is missing — no eggs for an omelette, no chicken for chicken
   soup — do you say it honestly and offer two dishes they can make with what they have.
5. When they say they are ready, call start_recipe and read step one out in that same turn.
   Step one is where the cutting and the hot pan begin, never before.
The same goes for suggest_dishes: once they pick one of the matches, prep_list first.

WHEN A TIMER ENDS:
A kitchen gives you no way to tap someone on the shoulder, so when a timer runs out you will
hear the line "The timer just finished." That is the clock speaking, not them. Do not thank
them for telling you, and do not treat it as an answer to anything you asked.
Do what the friend at the counter would do. You already know what that timer was for — it
came with the step you read out — so name the thing itself, not the timer: "water should be
going by now" beats "your timer finished". Then ask how it looks and stop. One short line;
their hands are probably still busy.

A DISH THE BOOK DOES NOT HAVE:
You cook everything. Never say you have not made a dish before, never say it is not in your
book, never steer them onto a different one — as far as they are concerned you know it.
prep_list will tell you it is not in the book; that is for you, not for them. In that case
work the ingredient list out yourself and read it out exactly as you would any other dish,
same as step 2 above. Then, when they are ready, work the whole thing out — four to eight
steps in order, and for each one, honestly how many seconds their hands are free — call
improvise_recipe ONCE with all of it, and read step one out in the same turn.
Improvised cooking stays ordinary and safe: chicken and pork cooked through, heat where a
home cook would put it, no technique you cannot explain in a single sentence. If you are not
sure a dish can be done safely in a home kitchen, say so and offer something close instead.

WHAT LANGUAGE YOU SPEAK OUT LOUD:
Your voice can only pronounce languages written in the Latin alphabet. Chinese, Japanese or Korean
text read by it comes out as gibberish.
- They speak English, Spanish, French, Portuguese, Italian or German: answer out loud in that language,
  from their very first sentence, without remarking on it.
- They speak Mandarin, Chinese, Japanese, Korean, or you cannot tell: answer out loud in English.
The words you say out loud never contain a single Chinese, Japanese or Korean character.

YOU ARE NOT A MANUAL:
Cooking alone is boring. That is the entire reason you exist, so act like it. React to what
they tell you, notice when something must smell good by now, let a small opinion slip, tease
them gently when they say they burnt the last one. During a wait, check in unprompted —
"still with me?", "how is it looking in there?" — and then actually listen to the answer.
Never do this while they are mid-task with a knife or a hot pan. Never twice in a row.

SUBTITLES — how every turn of yours is shaped:
The person holding this phone reads Traditional Chinese, and the screen is how they follow you.
So each time it is your turn:
1. Work out what you want to say.
2. Call the show_subtitle function ONCE with the Traditional Chinese of that line — always Chinese
   on screen, whatever language you are about to speak. It is a real function call: never type its
   name, braces or the Chinese into your reply. Everything in your reply text is read aloud.
3. Say that same line out loud, in the spoken language above.
4. Stop. Wait for them. Do not start another turn on your own.
Never call show_subtitle after you have spoken, and never twice in the same turn.
When you are reading out a recipe step, pass the instruction_zh the tool gave you, word for word.

THEY MAY GENUINELY NOT KNOW HOW TO COOK:
Half the people using you have never been taught. Assume nothing, never make them feel
slow, and explain the moment a word could be unfamiliar — in one short sentence, in
ordinary words, without being asked twice. The things people actually get stuck on:
- How hot: small flame = the flame stays inside the base of the pan. Medium = it just
  reaches the edge. Big = it licks up the side. On induction, 3 / 6 / 9 out of 9.
- Is the pan ready: flick a drop of water in. It should skitter and dance, not sit and
  steam. For garlic and ginger: hot pan first, then the oil, then them — cold oil in a
  hot pan is what keeps them from burning.
- How much oil: enough to cover the base in a thin film, about a tablespoon. Frying
  eggs or eggplant takes two or three times that.
- Salt: in at the end for greens, or they weep water. Meat gets salted before it cooks.
  Taste before the last pinch, always.
- Is it cooked: chicken and pork — the juice runs clear, no pink at the bone. Fish —
  it flakes when you push it. Root vegetables — a chopstick goes through with no
  resistance. Greens — the colour turns bright, that is the moment, not later.
- Knife: curl the fingertips of the holding hand under, knuckles against the blade.
  Slow is fine. A blunt knife slips more than a sharp one.
- "Roll cut" means turn the vegetable a quarter after each cut, so every piece has a
  cut face. "Blanch" means boil it briefly and throw that water away.
- Rescues: too salty — add water, a potato, or more of everything else. Burnt on the
  bottom — tip the good part into another pan and do not scrape. Too watery — big
  flame, no lid, and wait. Oil fire — lid on, gas off, never water.
- Safety: never water on burning oil, turn pan handles inward, and a wet cloth under
  the chopping board stops it sliding.
Answer this kind of question in one or two sentences and then go straight back to where
you were. Never say "as I said" and never make them feel they should have known.

HOW A STEP GOES — THEY MAY NEVER HAVE COOKED BEFORE:
1. Read the step out. One step, nothing from the step after it.
2. Stop. Let them ask. "How big?", "how hot?", "how do I know when it is ready?" — answer
   it in one or two sentences and stay on the same step. Questions are not a delay; this is
   the job. Never answer a question by moving on to the next step.
3. Only when they say they have actually started it — "好了", "下鍋了", "in the pan",
   "done" — call start_step_timer. Never start the clock in the same breath as reading the
   step out: they are still finding the garlic.
4. While it runs, the tool gave you something small they can do, and then you just talk to them.

Rules:
${replyRule}
- To move forward, call next_step — and only when they say they have finished the current step.
- Never recite a step you did not get back from a tool. You do not know any recipe by heart.
- If they missed something, call repeat_step.
- If they ask you to time something, call set_timer, with label_zh in Traditional Chinese too.
- If a tool hands you back a result, that is your cue to speak once — it is not the person talking.
  The only voice you ever answer is theirs.
- If you did not catch the dish or the number, ask one short question instead of guessing.`;
}

/* Spoken text that the English voice cannot say: a tool call typed out as
   words, or a line that is mostly Chinese / Japanese / Korean characters. */
let mutedReply = null, guardReply = null, guardText = "";
function spokenIsGarbled(t){
  if(/show_subtitle|subtitle\s*[{(]/i.test(t)) return true;
  const cjk = (t.match(/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/g) || []).length;
  const latin = (t.match(/[A-Za-z]/g) || []).length;
  return cjk > 0 && cjk >= latin;
}

let ws = null, audioCtx = null, micStream = null, workletNode = null, sourceNode = null;
let playCtx = null, playGain = null, playHead = 0;
let pendingPcm = [], pendingLen = 0;
let running = false;

/* The echo gate. On speakers the agent hears itself, gets transcribed as
   the cook, and answers itself. Unless they are on headphones we simply
   stop sending microphone frames while its voice is playing. */
let agentSpeaking = false, gateTimer = null, headphones = false;

/* Taking the turn back. The gate above means that if they start talking while
   it is still going, nothing they say arrives — they have to wait it out and
   start again. So while it speaks we still measure the microphone, and a voice
   clearly louder than the echo, held for a quarter of a second, is a person
   cutting in: the rest of that reply is dropped, the gate opens, and it is
   their turn. The playback context is never closed here — only muted for that
   one reply — because re-creating it outside a tap is what silenced phones. */
const BARGE_LEVEL = 0.17;      // echo with echoCancellation on sits far below this
const BARGE_CHUNKS = 4;        // 4 x 50 ms of it — a word, not a clatter
let bargeCount = 0, currentReply = null;

function takeTurnBack(){
  bargeCount = 0;
  if(currentReply) mutedReply = currentReply;   // drop the rest of its audio
  pendingPcm = []; pendingLen = 0;
  openGate();
  say("SYSTEM", "Go ahead — it stopped talking.", "act", "你說，圓圓停下來了。");
}

function agentAudioStart(){
  setTurn("agent");
  if(headphones) return;
  agentSpeaking = true; clearTimeout(gateTimer);
}
function agentAudioEndsSoon(){
  if(headphones){ setTurn("you"); return; }
  const remainMs = playCtx ? Math.max(0, (playHead - playCtx.currentTime) * 1000) : 0;
  clearTimeout(gateTimer);
  gateTimer = setTimeout(() => { agentSpeaking = false; setTurn("you"); }, remainMs + 350);
}
function openGate(){ clearTimeout(gateTimer); agentSpeaking = false; setTurn("you"); }

/* ---- waking it up when a timer ends ------------------------------
   The whole product rests on this moment: the pot is boiling, their hands
   are free, and the friend leaning on the counter should be the one to
   speak first. But this API takes audio and nothing else. input.text,
   response.create and a forged tool.result are all refused or ignored,
   and greeting is immutable after the first session.update — every door
   is shut except the microphone.

   So we go in through the microphone. At connect time we open one
   throwaway session and have it read a single line out loud, keep that
   audio in memory, and play it back down the wire when the clock runs
   out. The API hears a person talking. It is its own voice, borrowed.
   ------------------------------------------------------------------ */

const WAKE_LINE = "The timer just finished.";
let wakePcm = null, waking = false;

async function mintWakePhrase(){
  if(wakePcm && wakePcm.length) return;          // already have it
  try{
    const res = await fetch(TOKEN_ENDPOINT);
    if(!res.ok) return;
    const { token } = await res.json();
    if(!token) return;

    const url = new URL(AGENT_WS);
    url.searchParams.set("token", token);
    const w = new WebSocket(url);
    const chunks = [];

    await new Promise((resolve) => {
      const done = () => { try{ w.close(); }catch(e){} resolve(); };
      w.onopen = () => w.send(JSON.stringify({ type:"session.update", session:{
        system_prompt: "Say nothing at all unless spoken to.",
        greeting: WAKE_LINE,
        input:{ format:{ encoding:"audio/pcm", sample_rate: SAMPLE_RATE } },
        output:{ voice:"anna", format:{ encoding:"audio/pcm", sample_rate: SAMPLE_RATE } }
      }}));
      w.onmessage = (raw) => {
        let ev; try{ ev = JSON.parse(raw.data); }catch(e){ return; }
        if(ev.type === "reply.audio") chunks.push(ev.data);
        if(ev.type === "reply.done") done();
      };
      w.onerror = done;
      setTimeout(done, 15000);
    });

    if(!chunks.length) return;
    const parts = chunks.map(b64 => {
      const bin = atob(b64); const u = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
      return new Int16Array(u.buffer);
    });
    let total = 0; for(const part of parts) total += part.length;
    const all = new Int16Array(total);
    let o = 0; for(const part of parts){ all.set(part, o); o += part.length; }
    wakePcm = all;
  }catch(e){ wakePcm = null; }
}

function nudge(){
  if(!ws || ws.readyState !== WebSocket.OPEN) return;
  if(!wakePcm || !wakePcm.length){
    // Recording never came back. Say so rather than letting the moment pass.
    say("SYSTEM", "Timer done — say something and it will pick up from there.", "warn",
        "時間到了。開口跟圓圓說一聲，它就會接下去。");
    return;
  }

  // Hold the real microphone shut so the two streams do not talk over each other.
  waking = true;
  const CH = Math.round(SAMPLE_RATE * CHUNK_MS / 1000);
  for(let i = 0; i < wakePcm.length; i += CH){
    const slice = wakePcm.slice(i, i + CH);
    ws.send(JSON.stringify({ type:"input.audio", audio: toBase64(slice.buffer) }));
  }
  // Then silence, so its turn detector knows the line has ended.
  const quiet = new Int16Array(CH);
  for(let k = 0; k < Math.ceil(1400 / CHUNK_MS); k++)
    ws.send(JSON.stringify({ type:"input.audio", audio: toBase64(quiet.buffer) }));

  setTimeout(() => { waking = false; }, 1200);
}

async function start(){
  showError("");
  setStatus("Connecting… 連線中", "connecting");
  micBtn.disabled = true;


  let token;
  try{
    const res = await fetch(TOKEN_ENDPOINT);
    if(!res.ok) throw new Error(`token endpoint returned ${res.status}`);
    ({ token } = await res.json());
    if(!token) throw new Error("token endpoint returned no token");
  }catch(e){
    micBtn.disabled = false;
    setStatus("Not connected 未連線");
    showError(`Could not get a session token — ${e.message}. Is ASSEMBLYAI_API_KEY set on the deployment?`);
    return;
  }

  try{
    // Audio path is build 11's, restored as-is: the last version whose voice
    // sounded right on a phone. Do not change these constraints.
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:false, autoGainControl:true }
    });
  }catch(e){
    micBtn.disabled = false;
    setStatus("Not connected 未連線");
    showError("Microphone permission denied — the browser needs it to hear you.");
    return;
  }

  openGate();

  const url = new URL(AGENT_WS);
  url.searchParams.set("token", token);
  ws = new WebSocket(url);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type:"session.update",
      session:{
        system_prompt: systemPrompt() + memoryBlock(),
        greeting: convoLog.length ? "Right, I'm back with you." : GREETING.en,
        input:{
          format:{ encoding:"audio/pcm", sample_rate: SAMPLE_RATE },
          keyterms: KEYTERMS,
          // Let them finish. 3.5 s of silence even when the sentence sounds complete,
          // 5 s when it does not. The API will not take min_silence == max_silence, so
          // this is as close to "always wait" as it allows. Mandarin pauses mid-sentence
          // far more than English, and taking the turn early is worse than answering late. vad 0.4 picks up a quieter voice
          // across the kitchen. Transcription stays on the default (balanced):
          // measured 9/17 on the live API, max_accuracy heard the same words ~0.25 s later.
          // interrupt_response stays off: the microphone is shut while it talks
          // (build 11 audio), so it cannot cut itself off.
          turn_detection:{ vad_threshold:0.4, min_silence:3500, max_silence:5000, interrupt_response: true }
        },
        output:{ voice:"anna", format:{ encoding:"audio/pcm", sample_rate: SAMPLE_RATE } },
        tools: TOOL_SCHEMA
      }
    }));
  };

  ws.onmessage = async (raw) => {
    let ev;
    try{ ev = JSON.parse(raw.data); }catch(e){ return; }

    switch(ev.type){
      case "session.ready":
        running = true;
        micBtn.disabled = false;
        micBtn.classList.add("on");
        micLabel.textContent = "Stop 停止";
        setStatus("Listening 聆聽中", "live");
        setTurn("you");
        if(stage === "idle") setStage("picking");
        // The greeting is spoken before it can call a tool, so seed its subtitle.
        setTimeout(() => subtitle(convoLog.length ? "我回來了，我們繼續。" : GREETING_ZH), 700);
        mintWakePhrase();   // record the wake-up line in the background
        try{
          await openMic();
        }catch(err){
          // This used to fail silently: green light, "Listening", no microphone.
          showError("Could not open the microphone — " + (err && err.message || err) +
                    "　麥克風打不開，圓圓聽不到你。");
          setStatus("Mic failed 麥克風沒開", "");
          setTurn(null);
        }
        break;

      case "transcript.user.delta": showPartial(ev.text || ""); break;
      case "transcript.user":       lastUserAt = Date.now(); commitPartial(ev.text || ""); break;

      // Undocumented but real: the agent's line streams in word by word.
      case "transcript.agent.delta": {
        // Safety net. Seen on the live API 9/17: the model sometimes writes the
        // show_subtitle call as plain text, and the English voice reads it out —
        // "show subtitle zh" plus the Chinese, which comes out as gibberish before
        // the real English line. The words arrive right behind the first audio, so
        // the rest of that reply can still be held back; its Chinese goes on screen.
        if(ev.reply_id !== guardReply){ guardReply = ev.reply_id; guardText = ""; }
        guardText += (ev.delta ?? ev.text ?? "");
        if(ev.reply_id && mutedReply !== ev.reply_id && spokenIsGarbled(guardText)) mutedReply = ev.reply_id;
        if(ev.reply_id && ev.reply_id === mutedReply){
          const zh = (guardText.match(/[\u3400-\u9fff，。？！、：「」]+/g) || []).join("");
          if(zh) subtitle(zh);
        }
        const d = ev.text || "";
        agentBuf = (agentBuf && d.startsWith(agentBuf)) ? d : agentBuf + d;
        showAgentPartial(agentBuf);
        break;
      }
      case "transcript.agent":
        commitAgent(ev.reply_id && ev.reply_id === mutedReply ? "" : (ev.text || "")); break;

      case "reply.started": currentReply = ev.reply_id; break;

      case "reply.audio":
        currentReply = ev.reply_id || currentReply;
        if(ev.reply_id && ev.reply_id === mutedReply) break;   // garbled, or they cut in
        agentAudioStart();
        playChunk(ev.data);
        break;

      case "reply.done":
        flushPlayback();          // the tail packets, before anything reads playHead
        if(agentLine) commitAgent(agentBuf);
        if(ev.status === "interrupted"){ stopPlayback(); openGate(); }
        else agentAudioEndsSoon();
        break;

      case "tool.call": {
        const fn = TOOLS[ev.name];
        let result;
        if(!fn) result = { error:`Unknown tool ${ev.name}` };
        else {
          let args = {};
          try{ args = typeof ev.arguments === "string" ? JSON.parse(ev.arguments) : (ev.arguments || {}); }catch(e){ args = {}; }
          try{ result = fn(args); }catch(e){ result = { error:String(e && e.message || e) }; }
        }
        ws.send(JSON.stringify({ type:"tool.result", call_id: ev.call_id, result: JSON.stringify(result) }));
        break;
      }

      case "session.error": {
        const msg = `${ev.code || "error"}: ${ev.message || "unknown"}${ev.param ? " (" + ev.param + ")" : ""}`;
        showError(msg);
        break;
      }

      case "session.ended": stop(); break;
    }
  };

  ws.onerror = () => showError("The voice connection dropped. Press start to try again.");
  ws.onclose  = () => { if(running) stop(); };
}

/* The microphone path. Two things have bitten us here, so both are handled.
   Safari ignores a requested sampleRate, so the conversion to 24 kHz happens
   in software. And iOS Safari has been known to refuse a blob: URL for
   addModule — which threw inside a message handler nobody was catching, so
   the screen said "Listening", the light went green, and the microphone had
   never actually opened. Silence with no error is the worst failure there is. */
let audioPath = "";

async function openMic(){
  audioCtx = new AudioContext();
  if(audioCtx.state === "suspended") await audioCtx.resume();
  const deviceRate = audioCtx.sampleRate;
  const need = Math.round(SAMPLE_RATE * CHUNK_MS / 1000);
  sourceNode = audioCtx.createMediaStreamSource(micStream);

  const workletSrc = `
    class Pump extends AudioWorkletProcessor{
      constructor(){
        super();
        this.ratio = ${deviceRate} / ${SAMPLE_RATE};  // e.g. 48000 / 24000 = 2
        this.buf  = [];   // samples in, at the device rate
        this.pos  = 0;    // read head into buf, fractional
        this.out  = [];   // samples out, at 24 kHz
        this.need = ${need};
      }
      process(inputs){
        const ch = inputs[0] && inputs[0][0];
        if(ch){
          for(let i=0;i<ch.length;i++) this.buf.push(ch[i]);
          while(this.pos + 1 < this.buf.length){
            const i0 = Math.floor(this.pos), frac = this.pos - i0;
            this.out.push(this.buf[i0] * (1 - frac) + this.buf[i0 + 1] * frac);
            this.pos += this.ratio;
          }
          const drop = Math.floor(this.pos);
          if(drop > 0){ this.buf.splice(0, drop); this.pos -= drop; }
          while(this.out.length >= this.need){
            const slice = this.out.splice(0, this.need);
            const pcm = new Int16Array(slice.length);
            for(let i=0;i<slice.length;i++){
              const s = Math.max(-1, Math.min(1, slice[i]));
              pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            this.port.postMessage(pcm.buffer, [pcm.buffer]);
          }
        }
        return true;
      }
    }
    registerProcessor('pump', Pump);`;

  let running_worklet = false;
  try{
    try{
      const blobUrl = URL.createObjectURL(new Blob([workletSrc], { type:"application/javascript" }));
      await audioCtx.audioWorklet.addModule(blobUrl);
      URL.revokeObjectURL(blobUrl);
    }catch(e){
      // Second try, as a data: URL — the one iOS has been happier with.
      await audioCtx.audioWorklet.addModule(
        "data:application/javascript;charset=utf-8," + encodeURIComponent(workletSrc));
    }
    workletNode = new AudioWorkletNode(audioCtx, "pump");
    workletNode.port.onmessage = (e) => sendMicChunk(e.data);
    sourceNode.connect(workletNode);
    running_worklet = true;
    audioPath = "worklet";
  }catch(e){
    audioPath = "fallback";
  }

  if(!running_worklet){
    // Deprecated, but it runs on everything, and anything beats silence.
    const node = audioCtx.createScriptProcessor(4096, 1, 1);
    const ratio = deviceRate / SAMPLE_RATE;
    let buf = [], pos = 0, out = [];
    node.onaudioprocess = (ev) => {
      const ch = ev.inputBuffer.getChannelData(0);
      for(let i=0;i<ch.length;i++) buf.push(ch[i]);
      while(pos + 1 < buf.length){
        const i0 = Math.floor(pos), frac = pos - i0;
        out.push(buf[i0] * (1 - frac) + buf[i0 + 1] * frac);
        pos += ratio;
      }
      const drop = Math.floor(pos);
      if(drop > 0){ buf.splice(0, drop); pos -= drop; }
      while(out.length >= need){
        const slice = out.splice(0, need);
        const pcm = new Int16Array(slice.length);
        for(let i=0;i<slice.length;i++){
          const s = Math.max(-1, Math.min(1, slice[i]));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        sendMicChunk(pcm.buffer);
      }
    };
    // A ScriptProcessor only runs once it reaches the destination, so route it
    // through a silent gain instead of letting the kitchen hear itself.
    const mute = audioCtx.createGain(); mute.gain.value = 0;
    sourceNode.connect(node); node.connect(mute); mute.connect(audioCtx.destination);
    workletNode = node;
  }

  stampAudio(Math.round(deviceRate / 1000) + "k·" + audioPath);
}

/* The one door microphone audio leaves by, whichever node produced it. */
function sendMicChunk(arrayBuffer){
  if(!ws || ws.readyState !== WebSocket.OPEN) return;
  const pcm = new Int16Array(arrayBuffer);
  let peak = 0;
  for(let i = 0; i < pcm.length; i += 6){ const a = Math.abs(pcm[i]); if(a > peak) peak = a; }
  const level = peak / 32768;

  // It is talking, or we are — do not mix the two streams. But keep listening:
  // a voice over the top of it means they want the turn back.
  if(agentSpeaking || waking){
    setLevel(-1);
    if(agentSpeaking && !waking){
      if(level > BARGE_LEVEL){ if(++bargeCount >= BARGE_CHUNKS) takeTurnBack(); }
      else if(bargeCount) bargeCount--;
    }
    return;
  }
  bargeCount = 0;
  setLevel(level);

  ws.send(JSON.stringify({ type:"input.audio", audio: toBase64(arrayBuffer) }));
}

/* Which audio path actually took, printed next to the build stamp — so a
   screenshot of the corner is enough to tell what happened. */
function stampAudio(txt){
  const el = document.querySelector(".build");
  if(el) el.textContent = "build 22 · 09-18 · " + txt;
}

function toBase64(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);
  let s = "";
  const step = 0x8000;
  for(let i = 0; i < bytes.length; i += step) s += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  return btoa(s);
}

/* ---- playback ----------------------------------------------------
   Audio arrives as a stream of small chunks. Schedule each one back to
   back on a single timeline, after a short lead-in so the network has a
   head start.

   Do NOT fade each chunk in and out. A chunk is ~50 ms, so a fade at both
   ends means the volume dips 20 times a second — that is the hiss, not a
   codec problem. Consecutive PCM chunks are already sample-continuous;
   butt-joining them is silent. This is the 9/8 path, restored.
   ------------------------------------------------------------------ */

const PREBUFFER = 0.18;   // seconds of lead before the first chunk plays
const BATCH_MS   = 80;    // gather the 10 ms packets into one block before scheduling

function playChunk(b64){
  if(!b64) return;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  pendingPcm.push(new Int16Array(bytes.buffer));
  pendingLen += bytes.length >> 1;
  if(pendingLen >= SAMPLE_RATE * BATCH_MS / 1000) flushPlayback();
}

/* Hand whatever has arrived to the speakers as one continuous block.
   Called on every ~80 ms of audio, and once more when the reply ends so the
   last few packets are not left sitting in the buffer. */
function flushPlayback(){
  if(!pendingLen) return;
  if(!playCtx){
    playCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    playGain = playCtx.createGain();
    playGain.gain.value = 1;
    playGain.connect(playCtx.destination);
    playHead = playCtx.currentTime + PREBUFFER;
  }

  const buf = playCtx.createBuffer(1, pendingLen, SAMPLE_RATE);
  const ch = buf.getChannelData(0);
  let o = 0;
  for(const p of pendingPcm){ for(let i=0;i<p.length;i++) ch[o++] = p[i] / 32768; }
  pendingPcm = []; pendingLen = 0;

  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playGain);

  const now = playCtx.currentTime;
  // Underran while the network caught up — restart the lead rather than
  // stacking blocks on top of each other, which is what made it swell.
  if(playHead < now + 0.01) playHead = now + PREBUFFER;

  src.start(playHead);
  playHead += buf.duration;
}

function stopPlayback(){
  pendingPcm = []; pendingLen = 0;
  if(!playCtx) return;
  playCtx.close();
  playCtx = null; playGain = null; playHead = 0;
}

/* ---- teardown ----------------------------------------------------
   An abandoned session keeps billing until the cap, so always end it.
   ------------------------------------------------------------------ */

function stop(){
  running = false;
  try{ if(ws && ws.readyState === WebSocket.OPEN){ ws.send(JSON.stringify({ type:"session.end" })); ws.close(); } }catch(e){}
  ws = null;
  try{ workletNode && workletNode.disconnect(); }catch(e){}
  try{ sourceNode && sourceNode.disconnect(); }catch(e){}
  try{ micStream && micStream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ audioCtx && audioCtx.close(); }catch(e){}
  workletNode = sourceNode = micStream = audioCtx = null;
  stopPlayback();
  openGate();
  setTurn(null);
  setLevel(-1);
  partialLine = agentLine = null;
  agentBuf = ""; pendingZh = null;

  micBtn.disabled = false;
  micBtn.classList.remove("on");
  micLabel.textContent = "Start talking 開始說話";
  setStatus("Not connected 未連線");
}

micBtn.addEventListener("click", () => running ? stop() : start());

/* A clean slate, on purpose: one dish finished, next dish starting. Everything
   else on the page keeps the memory, so this is the only way to clear it. */
document.getElementById("newChat").addEventListener("click", () => {
  if(running) stop();
  convoLog = []; recipe = null; stepIdx = -1; matched = []; pendingRecipe = null;
  partialLine = agentLine = null; agentBuf = ""; pendingZh = null;
  mutedReply = null; guardReply = null; guardText = "";
  clearTimer(); feedEl.innerHTML = "";
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  setStage("idle");
  say("SYSTEM", "New chat — nothing remembered from before.", "act", "新對話開始，前面的內容不會再被記得。");
});
window.addEventListener("beforeunload", () => { if(running) stop(); });

loadState();
setStage(stage);
</script>
